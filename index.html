header { background:linear-gradient(100deg,#13372E,#152736,#231B4A);

  position:sticky; top:0; z-index:5; }

.logo i { position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(63,221,162,.25); }
.logo i:nth-child(2){ inset:6px; } .logo i:nth-child(3){ inset:12px; }
.logo b { position:absolute; left:50%; top:50%; width:9px; height:9px;
  margin:-4.5px; border-radius:50%; background:var(--mint); }
.logo s { position:absolute; inset:0; border-radius:50%; text-decoration:none;
  background:conic-gradient(from 0deg, rgba(63,221,162,.35), transparent 70deg);
  animation:sweep 3.6s linear infinite; }
@keyframes sweep { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .logo s { animation:none; } }
h1 { font-size:17px; letter-spacing:2px; margin:0; font-weight:800; }
h1 small { display:block; letter-spacing:.2px; font-size:11px;
  color:rgba(63,221,162,.65); font-weight:400; }

main { padding:12px 14px; max-width:640px; margin:0 auto; }
.note { color:var(--lo); font-size:12px; margin:8px 2px; }
.search input { width:100%; padding:13px 16px; border-radius:14px; border:0;

.search input::placeholder { color:var(--lo); }

.chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }

.chip.on { background:color-mix(in srgb, var(--c) 16%, transparent);

.chip u { text-decoration:none; opacity:.6; font-weight:400; margin-left:3px; }
.cats { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
.cats::-webkit-scrollbar { display:none; }
.cat { flex:none; display:flex; flex-direction:column; align-items:center; gap:1px;

  background:var(--panelhi); color:var(--lo); border:1px solid var(--line); cursor:pointer; }
.cat span { font-size:17px; } .cat u { text-decoration:none; opacity:.55; }
.cat.on { background:rgba(63,221,162,.16); border-color:rgba(63,221,162,.55); color:var(--mint); }

.card { display:flex; align-items:center; gap:12px; background:var(--panel);
  border-radius:18px; margin:10px 0; overflow:hidden; cursor:pointer; min-height:76px; }
.card .bar { width:4px; align-self:stretch; flex:none; }
.card img { width:60px; height:60px; object-fit:contain; border-radius:12px;
  background:var(--panelhi); flex:none; }
.noimg { width:60px; height:60px; border-radius:12px; background:var(--panelhi);
  display:flex; align-items:center; justify-content:center; font-weight:800; flex:none; }
.mid { flex:1; min-width:0; padding:10px 0; }
.tag { display:flex; align-items:center; gap:5px; font-size:10.5px;
  font-weight:800; letter-spacing:.8px; }
.tag i { width:7px; height:7px; border-radius:50%; display:inline-block; }
.nm { font-weight:600; font-size:13.5px; margin:3px 0;

.pill { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px;

.pill.amber { color:var(--amber); border-color:rgba(247,194,102,.45);

.pill.violet { color:var(--violet); border-color:rgba(166,149,242,.45);

.pill.mintf { color:var(--ink); background:var(--mint); border-color:var(--mint); }
.pr { text-align:right; padding:10px 12px 10px 0; flex:none; display:flex;
  flex-direction:column; align-items:flex-end; gap:1px; }
.pr b { font-size:19px; color:var(--mint); font-weight:900; letter-spacing:-.5px; }
.pr b em { font-style:normal; font-size:11px; margin-left:2px; }
.pr b.hot { color:var(--coral); }
.pr s { color:var(--lo); font-size:11px; }
.pr small { color:var(--lo); font-size:11px; }

.card.slim { min-height:60px; padding-left:0; }

.empty b { color:var(--hi); font-size:15px; }

.big { display:block; width:100%; margin:10px 0; }
.panel { background:var(--panel); border-radius:16px; padding:12px 14px; margin:10px 0; }

/* ---------- търсене: огледало на DataFeed.matchScore ---------- */
const MARKERS = new Set(["с","със","вкус","аромат","за","без","от","и","в","във","на","пълнеж","плънка"]);
const UNITS = new Set(["г","гр","кг","мл","л","ml","g","kg","l","бр","броя","х","x","см","cm","%"]);
const qWords = s => s.toLowerCase().split(/[^0-9a-zа-яё]+/)
  .filter(w => w && !/^\d/.test(w) && !UNITS.has(w));
const wordHit = (w, q) => w.startsWith(q) || (q.startsWith(w) && w.length >= 4);

/* Синоними и транслитерация — огледало на DataFeed. „Омар“ намира
   лобстер, „милка“ намира Milka. */
const SYN_GROUPS = [
  ["омар","лобстер","лобстър"],["скарид","шримс"],["пелен","памперс"],
  ["пуйк","пуешк"],["телешк","говежд"],["чушк","пиперк"],
  ["сьомг","somon","salmon"],["октопод","ахтапод"],["кашкавал","качокавал"],
  ["фъстъчен","фъстъц"],["уиски","whisky","whiskey"],["хамбургер","бургер"]];
const TRANSLIT = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z",
  "и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s",
  "т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a",
  "ь":"y","ю":"yu","я":"ya","ё":"yo"};
const translit = w => [...w].map(c => TRANSLIT[c] ?? c).join("");
function altsFor(q) {
  const out = [q];
  const g = SYN_GROUPS.find(g => g.some(t => t.startsWith(q) || q.startsWith(t)));
  if (g) out.push(...g);
  const tr = translit(q);
  if (tr !== q) out.push(tr);
  return out;
}

function matchScore(product, query) {
  const pw = qWords(product);
  if (!pw.length) return -1;
  const qw = qWords(query).filter(w => w.length >= 3);
  if (!qw.length) {
    const q = query.trim().toLowerCase();
    return (q.length >= 2 && pw.some(w => w.startsWith(q))) ? 0 : -1;
  }
  const single = qw.length === 1;
  let worst = 0, first = 1e9;
  for (const q of qw) {
    const alts = altsFor(q);
    let found = -1;
    for (let i = 0; i < pw.length; i++) {
      if (!alts.some(a => wordHit(pw[i], a))) continue;
      if (single && i > 0 && MARKERS.has(pw[i-1])) continue;
      if (single && i > 3) continue;
      found = i; break;
    }
    if (found < 0) return -1;
    if (found > worst) worst = found;
    if (found < first) first = found;
  }
  if (!single && first > 0 && MARKERS.has(pw[first-1])) return -1;
  return worst;
}

const SRC_LABEL = { 1: "официална", 2: "от магазина" };

function searchIn(items, query, limit = 80) {
  const seen = new Set();
  return items
    .map(it => [it, matchScore(it.n, query)])
    .filter(([it, sc]) => sc >= 0)
    .sort((a, b) => a[1] - b[1]
      || (a[0].u == null) - (b[0].u == null)
      || (a[0].u ?? a[0].p) - (b[0].u ?? b[0].p))
    .filter(([it]) => {
      const k = it.s + "|" + it.n.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    })
    .slice(0, limit)
    .map(([it]) => it);
}

function pricesEverywhere(items, query) {
  const per = {};
  for (const h of searchIn(items, query, 300)) {
    const k = h.s.toLowerCase();
    const v = h.u ?? h.p;
    if (!(k in per) || v < (per[k].u ?? per[k].p)) per[k] = h;
  }
  const rows = Object.values(per);
  const withUnit = rows.filter(r => r.u != null).length;
  return withUnit * 2 >= rows.length
    ? rows.sort((a, b) => (a.u == null) - (b.u == null) || (a.u ?? 1e9) - (b.u ?? 1e9) || a.p - b.p)
    : rows.sort((a, b) => a.p - b.p);
}

/* ---------- категории: огледало на Categories.of ---------- */
const ING = new Set(["с","със","от","вкус","аромат"]);
function tokenize(name) {
  return name
    .replace(/(?<=[a-zа-яё])(?=[A-ZА-ЯЁ])/g, " ")
    .replace(/(?<=[a-z])(?=[а-яё])|(?<=[а-яё])(?=[a-z])/g, " ")
    .replace(/(?<=[A-Za-zА-Яа-яЁё])(?=\d)|(?<=\d)(?=[A-Za-zА-Яа-яЁё])/g, " ")
    .toLowerCase().split(/[^0-9a-zа-яё]+/).filter(Boolean);
}
function catOf(name) {
  const low = name.toLowerCase();
  const words = tokenize(name);
  if (!words.length) return "drugo";
  let bc = "", bi = 1e9, bs = -1;
  const offer = (c, i, s) => { if (i < bi || (i === bi && s > bs)) { bc = c; bi = i; bs = s; } };
  for (const [cat, stems] of RULES) for (const stem of stems) {
    const t = stem.trim();
    if (/[^a-zа-яё ]/.test(t)) { if (low.includes(t)) offer(cat, 1, t.length); continue; }
    const exact = stem !== t;
    const parts = t.split(" ");
    let done = false;
    for (let i = 0; i <= words.length - parts.length; i++) {
      let ok = true;
      for (let j = 0; j < parts.length; j++) {
        const w = words[i + j], p = parts[j];
        if (exact ? w !== p : !(w.startsWith(p) && (p.length >= 5 || w.length <= p.length + 3))) { ok = false; break; }
      }
      if (!ok) continue;
      if (i === 0 || !ING.has(words[i-1])) { offer(cat, i, t.replace(/ /g, "").length); done = true; }
      break;
    }
    if (!done && parts.length === 1 && parts[0].length >= 4) {
      for (let i = 0; i < words.length; i++) {
        if (words[i].includes(parts[0]) && !/\d/.test(words[i])) {
          if (i === 0 || !ING.has(words[i-1])) offer(cat, i, parts[0].length - 1);
          break;
        }
      }
    }
  }
  return bs >= 0 ? bc : "drugo";
}
const catMeta = id => CATS.find(c => c[0] === id) || [id, "📦", id];

/* ---------- цвят на веригата: огледало на StoreColor ---------- */
const FALLBACK = ["#6EC1E4","#E4A76E","#9DE46E","#E46EC1","#6E7BE4","#E4D96E","#6EE4C1","#C16EE4"];
function storeColor(store) {
  const key = store.toLowerCase().split(" (")[0].trim();
  if (STORE_COLORS[key]) return STORE_COLORS[key];
  for (const k in STORE_COLORS) if (key.startsWith(k)) return STORE_COLORS[k];
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.codePointAt(0)) | 0;
  return FALLBACK[(h & 0x7fffffff) % FALLBACK.length];
}

function viewToday() {
  if (!S.idx) return `<div class="note">Зареждам фийда… Ако това не изчезне, провери връзката.</div>`;

  let head = `<div class="search"><input id="q" type="search" placeholder="Търси във всички магазини…" value="${esc(S.query)}"></div>`;

  if (q.length >= 2) {

    const res = searchIn(S.search, q);
    return head + (res.length

      : `<div class="empty"><b>Нищо за „${esc(q)}“</b><p>Пробвай по-обща дума — „мляко“ вместо „прясно мляко Верея 3%“.</p></div>`);
  }

  const stores = S.idx.stores.map(s => s.name);
  const extra = (S.idx.chains || []).filter(c => !stores.includes(c));
  const known = ["Билла","Метро","Фантастико","T-Market","Lilly","BulMag","КООП","ТРИСТА","Жанет","Аванти","Лекси","Класико"];
  extra.sort((a, b) => {
    const ia = known.indexOf(a), ib = known.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "bg");
  });

  const officialOnly = S.store && !stores.includes(S.store);

  let chips = `<div class="chips">` +
    chip("Всички", !S.store, "st:") +
    S.idx.stores.map(s => chip(s.name + ` <u>${s.count}</u>`, S.store === s.name, "st:" + s.name, storeColor(s.name))).join("") +
    chip("за единица", S.byUnit, "unit:", "#F7C266") +
    (extra.length ? (
      (S.more ? extra : extra.filter(c => c === S.store))
        .map(c => chip(c, S.store === c, "st:" + c, storeColor(c))).join("") +
      chip(S.more ? "скрий ▴" : "още вериги ▾", false, "more:", "#A695F2")
    ) : "") + `</div>`;

  let rows, names;
  if (officialOnly) {
    if (!S.search) return head + chips + `<div class="note">Зареждам цените…</div>`;
    rows = S.search.filter(it => it.s === S.store);
    names = rows.map(r => r.n);
  } else {
    rows = S.all.filter(o => !S.store || o.store === S.store);
    names = rows.map(r => r.name);
  }

  const present = {};
  for (const n of names) { const c = catOf(n); present[c] = (present[c] || 0) + 1; }
  const catsBar = `<div class="chips cats">` + CATS
    .filter(c => present[c[0]])
    .sort((a, b) => present[b[0]] - present[a[0]])
    .map(c => `<button class="cat ${S.cat === c[0] ? "on" : ""}" data-act="cat:${c[0]}">
      <span>${c[1]}</span>${esc(c[2])}<u>${present[c[0]]}</u></button>`).join("") + `</div>`;

  if (officialOnly) {
    let list = rows.filter(r => !S.cat || catOf(r.n) === S.cat);
    list = S.byUnit ? list.filter(r => r.u != null).sort((a, b) => a.u - b.u)
                    : list.sort((a, b) => a.p - b.p);
    return head + chips + catsBar +
      `<div class="note"><b>${list.length} цени в ${esc(S.store)}</b> — редовни цени от официалните данни на КЗП, не промоции.</div>` +
      list.slice(0, 400).map(hitRow).join("");
  }

  let list = rows.filter(o => !S.cat || catOf(o.name) === S.cat);
  list = S.byUnit ? list.filter(o => o.unitPrice != null).sort((a, b) => a.unitPrice - b.unitPrice)
                  : list.sort((a, b) => (discountPct(b) || 0) - (discountPct(a) || 0));
  const upd = S.idx.updated ? `<div class="note">${list.length} намаления · данните са от ${esc(S.idx.updated)}</div>` : "";
  return head + chips + catsBar + upd +
    (list.length ? list.slice(0, 600).map(offerCard).join("")
      : `<div class="empty"><b>Още зареждам офертите…</b></div>`);
}

const chip = (label, on, act, color) =>
  `<button class="chip ${on ? "on" : ""}" data-act="${esc(act)}" ${color ? `style="--c:${color}"` : ""}>${label}</button>`;

/* ---------- кошницата ---------- */
function viewList() {
  const items = S.list;
  let html = `<div class="note">Напиши какво ще купуваш — сметката показва в коя верига излиза най-евтино, по официалните цени и промоциите.</div>
  <div class="addrow"><input id="newitem" placeholder="напр. „мляко“, „яйца“, „кайма“"><button data-act="add:">Добави</button></div>`;
  if (!items.length) return html + `<div class="empty"><b>Списъкът е празен</b><p>Добави продукти и натисни „Къде е най-евтино?“.</p></div>`;
  html += `<button class="big" data-act="rank:">🧮 Къде е най-евтино?</button>`;

  if (S.ranking) {
    const r = S.ranking;
    html += `<div class="panel"><b>🏆 Кошницата по вериги</b>` +
      r.slice(0, 6).map(([chain, sum, cnt], i) =>
        `<div class="rrow ${chain === S.chosen ? "sel" : ""}" data-act="chain:${esc(chain)}">
          ${i === 0 ? "🥇" : (i + 1) + "."} <span style="color:${storeColor(chain)}">${esc(chain)}</span>
          — ${fmt(sum)} лв · ${cnt}/${items.length} артикула</div>`).join("") + `</div>`;
  }

  for (const it of items) {
    const done = S.checked.has(it);
    const rows = S.perItem ? (S.perItem[it] || []) : [];
    const inChosen = rows.find(h => h.s === S.chosen);
    html += `<div class="litem">
      <label><input type="checkbox" data-act="chk:${esc(it)}" ${done ? "checked" : ""}>
        <span class="${done ? "done" : ""}">${esc(it)}</span></label>
      ${inChosen ? `<b>${fmt(inChosen.p)} лв</b>` : ""}
      <button class="x" data-act="del:${esc(it)}">✕</button>
      ${rows.slice(0, 3).map(h => `<div class="sub" data-open="${esc(JSON.stringify({ t: "hit", s: h.s, n: h.n })).replace(/'/g, "&#39;")}">
          <span style="color:${storeColor(h.s)}">${esc(h.s)}</span> ${fmt(h.p)} лв — ${esc(h.n.slice(0, 38))}</div>`).join("")}
    </div>`;
  }
  if (S.chosen && S.perItem) {
    const total = items.reduce((a, it) => a + ((S.perItem[it] || []).find(h => h.s === S.chosen)?.p || 0), 0);
    const taken = items.filter(i => S.checked.has(i))
      .reduce((a, it) => a + ((S.perItem[it] || []).find(h => h.s === S.chosen)?.p || 0), 0);
    html += `<div class="panel"><b>🛒 ${esc(S.chosen)}</b><div>взети ${fmt(taken)} от ${fmt(total)} лв</div></div>`;
  }
  return html;
}

async function rank() {
  if (!S.search) { S.search = (await feed("feed/search.json"))?.items || []; }
  const per = {};
  for (const it of S.list) {
    const bystore = {};
    for (const h of searchIn(S.search, it, 400)) {
      if (!(h.s in bystore) || h.p < bystore[h.s].p) bystore[h.s] = h;
    }
    per[it] = Object.values(bystore).sort((a, b) => a.p - b.p);
  }
  const totals = {};
  for (const it of S.list) for (const h of per[it]) {
    totals[h.s] = totals[h.s] || [0, 0];
    totals[h.s][0] += h.p; totals[h.s][1]++;
  }
  S.perItem = per;
  S.ranking = Object.entries(totals).map(([c, [s, n]]) => [c, s, n])
    .sort((a, b) => b[2] - a[2] || a[1] - b[1]);
  S.chosen = S.ranking[0]?.[0] || null;
  render();
}

/* ---------- детайл ---------- */
/* С коя дума да се сравнява между вериги. Първите две думи често са
   МАРКАТА („ЧУДНИ ВАФЛИ“, „K-Classic“) и не съществуват другаде, затова
   се опитват все по-прости кандидати — кирилските думи преди латинските
   (латинските обикновено са марки), плюс отрязани окончания („вафл“
   хваща и вафла, и вафли) — и печели този с най-много вериги. */
function compareQuery(name, strict) {
  // Кандидатите, от най-точния към най-общия:
  //   1) първите две смислени кирилски думи („извара маджаров“ намира
  //      същия продукт в другите вериги);
  //   2) водещата дума — тази, чиято СОБСТВЕНА категория съвпада с
  //      категорията на продукта („извара“ при mlek);
  //   3) останалите думи и отрязаните им окончания.
  // Определенията („български“, „продукт“, „натурален“) не са стоки и
  // се прескачат, а имената се разлепят („продуктИзвара“ → две думи).
  // В строгия режим („същата стока“) остават само комбинациите стока +
  // марка — по-добре честно „няма я другаде“, отколкото друга марка.
  const cat = catOf(name);
  const toks = tokenize(name).filter(w => w.length >= 3 && !/^\d/.test(w));
  const cyr = toks.filter(w => /[а-я]/.test(w) && !cmpStop(w));
  const lat = toks.filter(w => !/[а-я]/.test(w) && !cmpStop(w));
  const head = cat !== "drugo" ? toks.find(w => !cmpStop(w) && catOf(w) === cat) : null;
  if (strict) {
    // Целта е обратната на „подобни“: печели НАЙ-ТЕСНИЯТ въпрос, който
    // все пак намира 2+ вериги („мляко верея“ бие „мляко кисело“).
    // Партньорът е поне 4 букви — „oro“, „био“ са твърде къси и хващат
    // чужди марки („кафе oro“ ловеше и Лидл Oro).
    const others = toks.filter(w => w.length >= 4 && !cmpStop(w) && w !== head).slice(0, 4);
    const pool = [];
    if (head) for (const t of others) {
      pool.push(head + " " + t);
      if (t.length >= 5) pool.push(head + " " + t.slice(0, -1));
    }
    if (cyr.length >= 2) pool.push(cyr[0] + " " + cyr[1]);
    if (!pool.length && head) pool.push(head);
    let sBest = [], sq = pool[0] || name.slice(0, 20);
    for (const q of [...new Set(pool)]) {
      let ev = pricesEverywhere(S.search, q);
      if (cat !== "drugo") ev = ev.filter(r => catOf(r.n) === cat);
      if (ev.length >= 2 && (sBest.length < 2 || ev.length < sBest.length)) { sBest = ev; sq = q; }
    }
    return [sBest, sq];
  }
  const cands = [];
  if (cyr.length >= 2) cands.push(cyr[0] + " " + cyr[1]);
  if (head) { cands.push(head); if (head.length >= 5) cands.push(head.slice(0, -1)); }
  for (const w of cyr.slice(0, 4)) { cands.push(w); if (w.length >= 5) cands.push(w.slice(0, -1)); }
  for (const w of lat.slice(0, 2)) cands.push(w);
  let best = [], bq = cands[0] || name.slice(0, 20);
  for (const q of [...new Set(cands)]) {
    let ev = pricesEverywhere(S.search, q);
    if (cat !== "drugo") ev = ev.filter(r => catOf(r.n) === cat);
    if (ev.length > best.length) { best = ev; bq = q; }
    if (best.length >= 4) break;
  }
  return [best, bq];
}
const CMP_STOP = ["българ","продукт","натурал","оригинал","премиум","класик","традицион","нискомасл","висококач","свеж"];
const cmpStop = w => CMP_STOP.some(s => w.startsWith(s));

async function openDetail(ref) {
  S.lastRef = ref;
  const o = ref.t === "offer"
    ? S.all.find(x => x.store === ref.s && x.name === ref.n)
    : null;
  const base = o || S.search?.find(x => x.s === ref.s && x.n === ref.n);
  if (!base) return;
  const name = o ? o.name : base.n, store = o ? o.store : base.s;
  const price = o ? o.price : base.p, old = o ? o.old : base.o;
  const pct = o ? discountPct(o) : (old && old > price ? Math.round((1 - price / old) * 100) : null);
  const ut = o ? unitText(o) : ((base.u != null && base.l) ? fmt(base.u) + " " + base.l : "");

  let html = `<div class="dtop">
    ${o && o.img ? `<img src="${esc(o.img)}" alt="">` : ""}
    <div class="tag" style="color:${storeColor(store)}"><i style="background:${storeColor(store)}"></i>${esc(store.toUpperCase())}</div>
    <h2>${esc(name)}</h2>
    <div class="dprice"><b class="${pct ? "hot" : ""}">${fmt(price)} лв</b><span>${eur(price)} €</span>
      ${old ? `<s>${fmt(old)} лв</s>` : ""}${pct ? `<span class="badge">−${pct}%</span>` : ""}</div>
    ${ut ? `<div class="pill amber">${ut}</div>` : ""}
  </div>`;

  if (S.search) {
    const [ev, kw] = compareQuery(name, S.cmpStrict);
    const modeBtns = `<div class="chips" style="margin:6px 0">
      <button class="chip ${S.cmpStrict ? "" : "on"}" data-cmpmode="0">Подобни продукти</button>
      <button class="chip ${S.cmpStrict ? "on" : ""}" data-cmpmode="1">Същата стока</button></div>`;
    if (ev.length >= 2) {
      const lo = Math.min(...ev.map(h => h.p)), hi = Math.max(...ev.map(h => h.p));
      html += `<h3>Цените навсякъде</h3>${modeBtns}
      <div class="note">в ${ev.length} вериги · от ${fmt(lo)} до ${fmt(hi)} лв · ${S.cmpStrict ? "същата стока" : "подобни продукти"} по „${esc(kw)}“</div>` +
        ev.slice(0, 7).map((h, i) => `<div class="crow ${i === 0 ? "best" : ""} ${h.s === store ? "cur" : ""}">
          <span class="tag" style="color:${storeColor(h.s)}"><i style="background:${storeColor(h.s)}"></i>${esc(h.s.toUpperCase())}</span>
          ${i === 0 ? '<span class="pill mintf">най-евтино</span>' : ""}
          ${h.s === store ? '<span class="mini">← гледаш това</span>' : ""}
          <div class="cn">${esc(h.n)}</div>
          <b>${fmt(h.p)} лв</b>${(h.u != null && h.l) ? `<small>${fmt(h.u)} ${h.l}</small>` : ""}
        </div>`).join("");
    } else {
      html += `<h3>Цените навсякъде</h3>${modeBtns}
      <div class="note">${S.cmpStrict
        ? "Не намерих същата стока в друга верига — виж „Подобни продукти“."
        : "Не намерих подобен продукт в друга верига."}</div>`;
    }
  } else {
    html += `<div class="note">Индексът с всички цени още се тегли — отвори пак след миг.</div>`;
  }

  if (S.history) {
    const key = store.trim().toLowerCase() + "|" + name.replace(/\s+/g, " ").trim().toLowerCase().slice(0, 60);
    const h = S.history.h && S.history.h[key];
    if (h && h.p.length >= 2) {
      html += `<h3>История на цената</h3><canvas id="chart" height="130"></canvas>
        <div class="note">${h.d[0]} → ${h.d[h.d.length - 1]} · всяка точка е засечена промяна</div>`;
      setTimeout(() => drawChart(h), 30);
    } else if (h) {
      html += `<div class="note">История: следим тази цена от ${h.d[0]} — графиката се появява при първата промяна.</div>`;
    }
  }

  html += `<div class="dbtns">
    ${o && o.url ? `<a class="btn" href="${esc(o.url)}" target="_blank" rel="noopener">🔗 Виж в сайта на магазина</a>` : ""}
    <button class="btn" data-share="${esc(name)}|${fmt(price)}|${esc(store)}${pct ? "|" + pct : ""}">📤 Сподели</button>
    <button class="btn ghost" data-close>Затвори</button>
  </div>`;

  $("sheet").innerHTML = html;
  $("modal").classList.add("open");
}

function drawChart(h) {
  const cv = $("chart"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 130;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const min = Math.min(...h.p), max = Math.max(...h.p);
  const span = Math.max(max - min, 0.01);
  const X = i => 8 + (W - 16) * i / (h.p.length - 1);
  const Y = p => 10 + (H - 30) * (1 - (p - min) / span);
  g.strokeStyle = "#374551"; g.lineWidth = 1;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(0, 10 + (H - 30) * i / 2); g.lineTo(W, 10 + (H - 30) * i / 2); g.stroke(); }
  g.strokeStyle = "#3FDDA2"; g.lineWidth = 3; g.lineJoin = "round"; g.beginPath();
  h.p.forEach((p, i) => i ? g.lineTo(X(i), Y(p)) : g.moveTo(X(i), Y(p)));
  g.stroke();
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "rgba(63,221,162,.28)"); grad.addColorStop(1, "rgba(63,221,162,0)");
  g.lineTo(X(h.p.length - 1), H); g.lineTo(X(0), H); g.closePath(); g.fillStyle = grad; g.fill();
  g.fillStyle = "#3FDDA2";
  h.p.forEach((p, i) => { g.beginPath(); g.arc(X(i), Y(p), 4, 0, 7); g.fill(); });
  g.fillStyle = "#95A4B1"; g.font = "11px system-ui";
  g.fillText("макс " + fmt(max), 8, 9); g.fillText("мин " + fmt(min), 8, H - 3);
}

/* ---------- събития ---------- */
function bind() {
  const q = $("q");
  if (q) q.oninput = () => { S.query = q.value; renderKeepFocus(); };
  const ni = $("newitem");
  if (ni) ni.onkeydown = e => { if (e.key === "Enter") addItem(); };
}
function renderKeepFocus() {
  const pos = $("q")?.selectionStart;
  render();
  const q = $("q");
  if (q) { q.focus(); if (pos != null) q.setSelectionRange(pos, pos); }
}
function addItem() {
  const v = $("newitem")?.value.trim();
  if (v && !S.list.includes(v)) { S.list.push(v); S.ranking = null; saveList(); }
  render();
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { openDetail(JSON.parse(open.dataset.open)); return; }
  if (e.target.closest("[data-close]") || e.target.id === "modal") {
    $("modal").classList.remove("open"); return;
  }
  const cm = e.target.closest("[data-cmpmode]");
  if (cm) {
    S.cmpStrict = cm.dataset.cmpmode === "1";
    if (S.lastRef) openDetail(S.lastRef);
    return;
  }
  const sh = e.target.closest("[data-share]");
  if (sh) {
    const [n, p, st, pct] = sh.dataset.share.split("|");
    const txt = `🔥 ${n}\n${p} лв${pct ? " (−" + pct + "%)" : ""} — ${st}\n\n📡 Намерено с Промо Радар`;
    if (navigator.share) navigator.share({ text: txt }).catch(() => {});
    else { navigator.clipboard?.writeText(txt); sh.textContent = "✓ Копирано"; }
    return;
  }
  const nav = e.target.closest(".nav button");
  if (nav) { S.tab = nav.dataset.tab; render(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const [cmd, arg] = act.dataset.act.split(/:(.*)/);
  if (cmd === "st") { S.store = arg || null; S.more = false; S.cat = null; }
  if (cmd === "more") S.more = !S.more;
  if (cmd === "unit") S.byUnit = !S.byUnit;
  if (cmd === "cat") S.cat = S.cat === arg ? null : arg;
  if (cmd === "add") { addItem(); return; }
  if (cmd === "rank") { rank(); return; }
  if (cmd === "chain") S.chosen = arg;
  if (cmd === "del") { S.list = S.list.filter(x => x !== arg); S.checked.delete(arg); S.ranking = null; saveList(); }
  if (cmd === "chk") { S.checked.has(arg) ? S.checked.delete(arg) : S.checked.add(arg); saveList(); }
  render();
});

boot();
