  }
  const url = o ? safeUrl(o.url) : "";
  html += `<div class="dbtns">
    ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 Виж в сайта на магазина</a>` : ""}
    <button class="btn" data-watch="${esc(kw)}">${watching ? "🔕 Спри следенето" : "🔔 Следи „" + esc(kw) + "“"}</button>
    <button class="btn ghost" data-addlist="${esc(kw)}">🛒 Добави „${esc(kw)}“ в списъка</button>
    ${repHtml}
    <button class="btn" data-share="${esc(name)}|${eur(price)} €|${esc(store)}${pct ? "|" + pct : ""}">📤 Сподели</button>
    <button class="btn ghost" data-close>Затвори</button>
  </div>`;

  if (!S.history && !S.histPending) {
    // Първото отваряне на продукт тегли историята и пре-рисува листа.
    S.histPending = true;
    feed("feed/history.json").then(f => {
      S.history = f || { h: {} };
      S.histPending = false;
      if ($("modal").classList.contains("open") && S.lastRef)
        openDetail(S.lastRef, false);
    });
  }

  const actionStart = html.lastIndexOf('<div class="dbtns">');
  const actions = html.slice(actionStart);
  html = html.slice(0, actionStart);
  const afterHero = html.indexOf("</div>", html.indexOf('class="dprice"')) + 6;
  html = html.slice(0, afterHero) + actions + html.slice(afterHero);
  $("sheet").innerHTML = html;
  const m = $("modal");
  if (!m.classList.contains("open")) {
    m.classList.add("open");
    // Системният бутон „назад“ на Android затваряше цялото приложение,
    // вместо детайла. Един запис в историята решава това.
    if (!S.histPushed) { history.pushState({ pr: "detail" }, ""); S.histPushed = true; }
  }
  m.scrollTop = 0;
  $("sheet").focus();
}
function closeDetail(fromHistory) {
  $("modal").classList.remove("open");
  S.detailStack = [];
  S.lastRef = null;
  if (S.histPushed && !fromHistory) { S.histPushed = false; history.back(); }
  else S.histPushed = false;
  render();   // следените думи може да са се променили в детайла
}

function drawChart(h) {
  const cv = $("chart"); if (!cv) return;
  // Цветовете идват от темата, не са зашити. В светла тема ментовото
  // #3FDDA2 върху бял панел е контраст 1.74:1 — кривата практически
  // изчезва, а тъмната мрежа доминира картината.
  const css = getComputedStyle(document.documentElement);
  const V = (n, d) => (css.getPropertyValue(n) || "").trim() || d;
  const cMint = V("--mint", "#3FDDA2"), cLine = V("--line", "#374551"),
        cLo = V("--lo", "#95A4B1");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 130;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const min = Math.min(...h.p), max = Math.max(...h.p);
  const span = Math.max(max - min, 0.01);
  const X = i => 8 + (W - 16) * i / (h.p.length - 1);
  const Y = p => 10 + (H - 30) * (1 - (p - min) / span);
  g.strokeStyle = cLine; g.lineWidth = 1;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(0, 10 + (H - 30) * i / 2); g.lineTo(W, 10 + (H - 30) * i / 2); g.stroke(); }
  g.strokeStyle = cMint; g.lineWidth = 3; g.lineJoin = "round"; g.beginPath();
  h.p.forEach((p, i) => i ? g.lineTo(X(i), Y(p)) : g.moveTo(X(i), Y(p)));
  g.stroke();
  const grad = g.createLinearGradient(0, 0, 0, H);
  // color-mix дава прозрачност върху цвят от променлива, каквото и да е той
  grad.addColorStop(0, `color-mix(in srgb, ${cMint} 26%, transparent)`);
  grad.addColorStop(1, `color-mix(in srgb, ${cMint} 0%, transparent)`);
  g.lineTo(X(h.p.length - 1), H); g.lineTo(X(0), H); g.closePath(); g.fillStyle = grad; g.fill();
  g.fillStyle = cMint;
  h.p.forEach((p, i) => { g.beginPath(); g.arc(X(i), Y(p), 4, 0, 7); g.fill(); });
  g.fillStyle = cLo; g.font = "11.5px system-ui";
  g.fillText("макс " + eur(max) + " €", 8, 9); g.fillText("мин " + eur(min) + " €", 8, H - 3);
}

/* ---------- събития ---------- */
function bind() {
  const q = $("q");
  // S.limit се нулира при нова заявка: иначе след няколко „Покажи още“
  // всяка натисната буква пречертава 1400 карти.
  if (q) q.oninput = () => {
    S.query = q.value;
    if (S.sugOff !== S.query) S.sugOff = null;   // ново писане → пак подсказки
    S.limit = 120;
    renderKeepFocus();
  };
  const ni = $("newitem");
  if (ni) {
    ni.onkeydown = e => { if (e.key === "Enter") addItem(); };
    ni.oninput = async () => {
      S.nq = ni.value;
      if (S.nq.trim().length >= 2 && !S.search)
        S.search = await loadSearch();
      renderKeepFocus("newitem");
    };
  }
}
function renderKeepFocus(id = "q") {
  const pos = $(id)?.selectionStart;
  render();
  const el = $(id);
  if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); }
}
/* Добавянето е БЕЗ регистър — иначе „Мляко“ и „мляко“ ставаха два реда и
   се брояха два пъти. */
function addItem(val) {
  const el = $("newitem");
  const v = (val != null ? val : (el ? el.value : "")).trim();
  if (v && !S.list.some(x => x.toLowerCase() === v.toLowerCase())) {
    S.list.push(v);
    S.nq = "";
    listChanged();
    return;
  }
  S.nq = "";
  render();
}

document.addEventListener("change", e => {
  const item = e.target.dataset.amount || e.target.dataset.measure;
  if (!item) return;
  const previous = basketAmount(item);
  const amount = e.target.dataset.amount
    ? { ...previous, quantity: Number(e.target.value) } : { ...previous, unit: e.target.value };
  if (!Number.isFinite(amount.quantity) || amount.quantity <= 0 || amount.quantity > 1000 ||
      !["кг","л","бр"].includes(amount.unit)) { e.target.value = previous.quantity; return; }
  S.amounts.set(item, amount); listChanged();
});
document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { openDetail(JSON.parse(open.dataset.open)); return; }
  if (e.target.closest("[data-back]")) {
    const prev = S.detailStack.pop();
    if (prev) openDetail(prev, false); else closeDetail();
    return;
  }
  if (e.target.closest("[data-close]") || e.target.id === "modal") {
    closeDetail();
    return;
  }
  const th = e.target.closest("[data-settheme]");
  if (th) {
    S.theme = th.dataset.settheme;
    write("pr_theme", S.theme);
    applyTheme(); render(); return;
  }
  const hd = e.target.closest("[data-hide]");
  if (hd) {
    const c = hd.dataset.hide;
    S.hidden.has(c) ? S.hidden.delete(c) : S.hidden.add(c);
    if (S.store && S.hidden.has(S.store)) S.store = null;
    saveHidden();
    if (S.list.length && S.perItem) rank(); else render();
    return;
  }
  const sb = e.target.closest("[data-sharebasket]");
  if (sb && S.ranking) {
    // Покритието влиза в текста: „12,40 €“ без „8 от 8“ подвежда.
    const txt = "🛒 Кошницата ми по вериги:\n" + S.ranking.slice(0, 5)
      .map(([c, s, n], i) => `${i + 1}. ${c} — ${eur(s)} € · ${n} от ${S.list.length} артикула`)
      .join("\n") + "\n\n📡 Сметнато с Промо Радар";
    if (navigator.share) navigator.share({ text: txt }).catch(() => {});
    else if (navigator.clipboard) { navigator.clipboard.writeText(txt); sb.textContent = "✓ Копирано"; }
    return;
  }
  const al = e.target.closest("[data-addlist]");
  if (al) { addItem(al.dataset.addlist); closeDetail(); return; }
  if (e.target.closest("[data-reload]")) { location.reload(); return; }
  const w = e.target.closest("[data-watch]");
  if (w) {
    const kw = w.dataset.watch;
    S.watch = S.watch.includes(kw) ? S.watch.filter(x => x !== kw) : [...S.watch, kw];
    saveWatch();
    if (S.lastRef) openDetail(S.lastRef, false); else render();
    return;
  }
  const uw = e.target.closest("[data-unwatch]");
  if (uw) {
    S.watch = S.watch.filter(x => x !== uw.dataset.unwatch);
    saveWatch(); render(); return;
  }
  const rb = e.target.closest("[data-repbtn]");
  if (rb) { S.repOpen = rb.dataset.repbtn; if (S.lastRef) openDetail(S.lastRef, false); return; }
  const rs = e.target.closest("[data-repsend]");
  if (rs) {
    const f = (S.cfg && S.cfg.reportFields) || {};
    const body = new URLSearchParams();
    const vals = { store: rs.dataset.store, product: rs.dataset.name,
                   shownPrice: rs.dataset.price,
                   realPrice: $("repprice") ? $("repprice").value : "",
                   kind: $("repkind") ? $("repkind").value : "" };
    for (const k in f) if (vals[k] != null) body.append(f[k], vals[k]);
    fetch(S.cfg.reportUrl, { method: "POST", mode: "no-cors", body }).catch(() => {});
    S.reported[rs.dataset.repsend] = 1; S.repOpen = false;
    if (S.lastRef) openDetail(S.lastRef, false);
    return;
  }
  const sug = e.target.closest("[data-addsug]");
  if (sug) { addItem(sug.dataset.addsug); return; }
  const sq = e.target.closest("[data-sug]");
  if (sq) {
    // Избраната подсказка става заявка, а списъкът се скрива — иначе
    // остава да виси над собствения си резултат.
    S.query = sq.dataset.sug;
    S.sugOff = S.query;
    S.limit = 120;
    render();
    return;
  }
  const cm = e.target.closest("[data-cmpmode]");
  if (cm) {
    S.cmpStrict = cm.dataset.cmpmode === "1";
    if (S.lastRef) openDetail(S.lastRef, false);
    return;
  }
  const sh = e.target.closest("[data-share]");
  if (sh) {
    const [n, p, st, pct] = sh.dataset.share.split("|");
    const txt = `🔥 ${n}\n${p}${pct ? " (−" + pct + "%)" : ""} — ${st}\n\n📡 Намерено с Промо Радар`;
    if (navigator.share) navigator.share({ text: txt }).catch(() => {});
    else { navigator.clipboard?.writeText(txt); sh.textContent = "✓ Копирано"; }
    return;
  }
  const nav = e.target.closest(".nav button");
  if (nav) { S.tab = nav.dataset.tab; S.limit = 120; render(); if (S.tab === "list" && S.list.length && !S.ranking && !S.busy) rank(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const [cmd, arg] = act.dataset.act.split(/:(.*)/);
  if (cmd === "st") { S.store = arg || null; S.more = false; S.cat = null; S.limit = 120; }
  if (cmd === "more") S.more = !S.more;
  if (cmd === "unit") { S.byUnit = !S.byUnit; S.limit = 120; }
  if (cmd === "near") { toggleNear(); return; }
  if (cmd === "nodigest") S.digestGone = true;
  if (cmd === "limit") S.limit += 240;
  if (cmd === "cat") { S.cat = S.cat === arg ? null : arg; S.limit = 120; }
  if (cmd === "add") { addItem(); return; }
  if (cmd === "quick") { addItem(arg); return; }
  if (cmd === "week") {
    for (const w of QUICK_ITEMS.slice(0, 8))
      if (!S.list.some(x => x.toLowerCase() === w.toLowerCase())) S.list.push(w);
    listChanged(); return;
  }
  if (cmd === "rank") { rank(); return; }
  if (cmd === "chain") S.chosen = arg;
  if (cmd === "del") {
    S.list = S.list.filter(x => x !== arg); S.checked.delete(arg);
    listChanged(); return;
  }
  if (cmd === "uncheck") { S.checked.clear(); saveList(); }
  if (cmd === "showall") { S.hidden.clear(); saveHidden(); }
  if (cmd === "chk") { S.checked.has(arg) ? S.checked.delete(arg) : S.checked.add(arg); saveList(); }
  render();
});

/* Клавиатура: Escape затваря детайла, Enter/интервал натиска редовете с
   role="button" (те са <div>, значи браузърът не го прави сам). */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("modal").classList.contains("open")) {
    closeDetail(); return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute
      && e.target.getAttribute("role") === "button") {
    e.preventDefault(); e.target.click();
  }
});
/* Системният бутон „назад“ на Android: първо се връща в детайла, после
   го затваря — вместо да излиза от приложението. */
window.addEventListener("popstate", () => {
  if (!$("modal").classList.contains("open")) return;
  S.histPushed = false;
  const prev = S.detailStack.pop();
  if (prev) { openDetail(prev, false); history.pushState({ pr: "detail" }, ""); S.histPushed = true; }
  else closeDetail(true);
});

boot();

</script>
