<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Промо Радар — твоят списък, по-добра сметка</title>
<meta name="description" content="Сравни цените за твоя списък, избери количества и следи интересните продукти в покритите магазини.">
<meta name="theme-color" content="#13372E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#DFF3EA" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Промо Радар">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23131A22'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%233FDDA2' stroke-opacity='.35'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%233FDDA2' stroke-opacity='.35'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%233FDDA2'/%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Промо Радар","short_name":"ПромоРадар","display":"standalone","background_color":"%23131A22","theme_color":"%2313372E","start_url":"."}'>
<style>
/* Същата визуална идентичност като Android приложението: мастило, ментов
   сигнал, корал за попадение, кехлибар за мярка, цветна лента на веригата. */
:root {
  --ink:#131A22; --panel:#1E2832; --panelhi:#2A3641; --line:#374551;
  --hi:#E4EBF1; --lo:#95A4B1; --mint:#3FDDA2; --coral:#FF7A7A;
  --amber:#F7C266; --violet:#A695F2;
  --mint16:rgba(63,221,162,.16); --mint55:rgba(63,221,162,.55);
  --herobg:linear-gradient(100deg,#13372E,#152736,#231B4A);
  --heroon:#FFFFFF; --herosub:rgba(63,221,162,.65);
  --badgebg:linear-gradient(90deg,var(--coral),#FFA95E);
  --badgefg:var(--ink); --mintfg:var(--ink);
}
/* Тема като телефона: същата премерена светла палитра като приложението
   (мента 5.0:1, текст 16.6:1 върху бяло). Включва се сама по системната
   настройка, но ръчният избор в „Още“ я преодолява — затова правилата са
   два пъти: веднъж по медия, веднъж по data-theme на <html>. */
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    --ink:#F5F7FB; --panel:#FFFFFF; --panelhi:#EEF2F8; --line:#E1E8F0;
    --hi:#12202B; --lo:#55677A; --mint:#00805A; --coral:#C41E2E;
    --amber:#8A5B00; --violet:#5B46C8;
    --mint16:rgba(0,128,90,.12); --mint55:rgba(0,128,90,.5);
    --herobg:linear-gradient(100deg,#DFF3EA,#E9F1FF,#F3EEFF);
    --heroon:#123528; --herosub:#00674A; --shadow:0 1px 4px rgba(18,32,43,.06);
    --badgebg:var(--coral); --badgefg:#fff; --mintfg:#fff;
  }
}
html[data-theme="light"] {
  --ink:#F5F7FB; --panel:#FFFFFF; --panelhi:#EEF2F8; --line:#E1E8F0;
  --hi:#12202B; --lo:#55677A; --mint:#00805A; --coral:#C41E2E;
  --amber:#8A5B00; --violet:#5B46C8;
  --mint16:rgba(0,128,90,.12); --mint55:rgba(0,128,90,.5);
  --herobg:linear-gradient(100deg,#DFF3EA,#E9F1FF,#F3EEFF);
  --heroon:#123528; --herosub:#00674A; --shadow:0 1px 4px rgba(18,32,43,.06);
  --badgebg:var(--coral); --badgefg:#fff; --mintfg:#fff;
}
.card, .panel, .litem { box-shadow:var(--shadow,none); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--ink); color:var(--hi);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { padding-bottom:calc(76px + env(safe-area-inset-bottom)); }

header { background:var(--herobg);
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:5; }
header::after { content:""; position:absolute; left:0; right:30%; bottom:-2px;
  height:2px; background:linear-gradient(90deg,var(--mint),var(--violet),transparent); }
.logo { width:36px; height:36px; position:relative; flex:none; }
.logo i { position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(63,221,162,.25); }
.logo i:nth-child(2){ inset:6px; } .logo i:nth-child(3){ inset:12px; }
.logo b { position:absolute; left:50%; top:50%; width:9px; height:9px;
  margin:-4.5px; border-radius:50%; background:var(--mint); }
.logo s { position:absolute; inset:0; border-radius:50%; text-decoration:none;
  background:conic-gradient(from 0deg, rgba(63,221,162,.35), transparent 70deg);
  animation:sweep 3.6s linear infinite; }
@keyframes sweep { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce){ .logo s { animation:none; } }
h1 { font-size:17px; letter-spacing:2px; margin:0; font-weight:800; color:var(--heroon); }
h1 small { display:block; letter-spacing:.2px; font-size:11px;
  color:var(--herosub); font-weight:400; }

main { padding:12px 14px; max-width:640px; margin:0 auto; }
.note { color:var(--lo); font-size:12px; margin:8px 2px; }
.search input { width:100%; padding:13px 16px; border-radius:14px; border:0;
  background:var(--panelhi); color:var(--hi); font-size:15px; outline:none; }
.search input::placeholder { color:var(--lo); }

.chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
.chip { --c:var(--mint); border-radius:99px; padding:8px 14px; font-size:13px;
  font-weight:700; background:var(--panelhi); color:var(--lo);
  border:1px solid var(--line); cursor:pointer; }
.chip.on { background:color-mix(in srgb, var(--c) 16%, transparent);
  border-color:color-mix(in srgb, var(--c) 55%, transparent); color:var(--c); }
.chip u { text-decoration:none; opacity:.6; font-weight:400; margin-left:3px; }
.cats { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
.cats::-webkit-scrollbar { display:none; }
.cat { flex:none; display:flex; flex-direction:column; align-items:center; gap:1px;
  min-width:64px; padding:8px 10px; border-radius:14px; font-size:11px;
  background:var(--panelhi); color:var(--lo); border:1px solid var(--line); cursor:pointer; }
.cat span { font-size:17px; } .cat u { text-decoration:none; opacity:.55; }
.cat.on { background:var(--mint16); border-color:var(--mint55); color:var(--mint); }

/* Картата: плочка с обраꙁ отляво, име в средата, цена отдясно.
   Веригата вече не е дебела лента отстрани, а тънък кант плюс точка до
   името — лентата крадеше място и не казваше нищо повече от точката. */
.card { display:flex; align-items:center; gap:13px; background:var(--panel);
  border-radius:16px; margin:9px 0; padding:11px 13px; cursor:pointer;
  border-left:3px solid var(--sc,var(--line)); }
.card:active { transform:scale(.995); }
/* Плочката. Снимка и икона заемат ЕДНО И СЪЩО място, за да не подскача
   редът, когато едните ги има, а другите — не. */
.th { flex:none; border-radius:14px; background:var(--panelhi);
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
img.th { object-fit:contain; }
.th.ico { background:color-mix(in srgb, var(--ic) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--ic) 22%, transparent); }
.mid { flex:1; min-width:0; }
/* Името е героят, не веригата. Затова тя е дребна и приглушена, с точка
   в цвета си — четеш продукта, после откъде е. */
.tag { display:flex; align-items:center; gap:5px; font-size:11px;
  font-weight:700; letter-spacing:.6px; color:var(--lo); }
.tag i { width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }
.nm { font-weight:500; font-size:14px; line-height:1.35; margin:3px 0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pill { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px;
  border-radius:7px; border:1px solid; }
.pill.amber { color:var(--amber); border-color:rgba(247,194,102,.45);
  background:rgba(247,194,102,.12); }
.pill.violet { color:var(--violet); border-color:rgba(166,149,242,.45);
  background:rgba(166,149,242,.12); margin-left:6px; }
.pill.mintf { color:var(--mintfg); background:var(--mint); border-color:var(--mint); }
.pr { text-align:right; flex:none; display:flex;
  flex-direction:column; align-items:flex-end; gap:1px; }
.pr b { font-size:20px; color:var(--mint); font-weight:800; letter-spacing:-.5px; }
.pr b em { font-style:normal; font-size:11px; margin-left:2px; }
.pr b.hot { color:var(--coral); }
.pr s { color:var(--lo); font-size:11px; }
.pr small { color:var(--lo); font-size:11px; }
.badge { background:var(--badgebg); color:var(--badgefg);
  font-weight:900; font-size:11px; padding:2px 7px;
  border-radius:9px 3px 9px 3px; }
.card.slim { min-height:60px; padding-left:0; }
.empty { text-align:center; padding:40px 20px; color:var(--lo); }
.empty b { color:var(--hi); font-size:15px; }

.nav { position:fixed; left:16px; right:16px;
  bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:4px;
  background:var(--panelhi); border:1px solid var(--line); border-radius:26px;
  padding:6px; z-index:6; max-width:608px; margin:0 auto; }
.nav button { flex:1; display:flex; align-items:center; justify-content:center;
  gap:7px; border:0; background:none; color:var(--lo); font-size:13px;
  font-weight:700; padding:12px 0; border-radius:20px; cursor:pointer; }
.nav button.on { background:var(--mint16); color:var(--mint); flex:1.6; }

.addrow { display:flex; gap:8px; margin:10px 0; }
.addrow input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--panelhi); color:var(--hi); font-size:14px; outline:none; }
.addrow button, .big { background:var(--mint); color:var(--ink); border:0;
  border-radius:12px; font-weight:800; padding:12px 18px; cursor:pointer; font-size:14px; }
.big { display:block; width:100%; margin:10px 0; }
.panel { background:var(--panel); border-radius:16px; padding:12px 14px; margin:10px 0; }
/* Победителят е ГОЛЯМ и очевидно натискаем. Досега класацията беше шест
   еднакви реда с числа и нищо не подсказваше нито кое е важното, нито че
   изобщо може да се натисне. */
.win { display:flex; align-items:center; gap:10px; cursor:pointer;
  background:var(--mint16); border:1px solid var(--mint55);
  border-radius:14px; padding:12px 14px; margin-bottom:8px; }
.winname { font-size:16px; font-weight:800; }
.winsum { font-size:22px; font-weight:800; color:var(--mint); flex:none; }
.rrow { display:flex; align-items:center; gap:8px; cursor:pointer;
  padding:9px 10px; border-radius:11px; margin:4px 0; min-height:44px;
  border:1px solid transparent; }
.rrow:hover { background:var(--panelhi); }
.rrow.sel { background:var(--panelhi); border-color:var(--mint55); }
.rrow > span:first-child { flex:1; min-width:0; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rrow b { flex:none; }
/* Редът за ИЗБРАНАТА верига се отличава от „другаде“ — иначе не се
   разбира кой ред за кой магазин е. */
.sub.here { background:var(--mint16); border-radius:9px; padding:5px 7px;
  margin-left:28px; margin-top:6px; }
.sub .mini { margin-left:auto; }
.litem { background:var(--panel); border-radius:14px; padding:10px 12px; margin:8px 0;
  position:relative; }
.litem label { display:flex; align-items:center; gap:9px; font-weight:600; }
.litem .done { text-decoration:line-through; color:var(--lo); }
.litem > b { position:absolute; right:44px; top:12px; color:var(--mint); }
.litem .x { position:absolute; right:10px; top:8px; background:none; border:0;
  color:var(--lo); font-size:14px; cursor:pointer; padding:4px; }
.litem .sub { font-size:12px; color:var(--lo); margin:5px 0 0 28px; cursor:pointer; }

#modal { position:fixed; inset:0; background:rgba(4,7,10,.8); display:none;
  z-index:10; overflow-y:auto; padding:24px 14px; }
#modal.open { display:block; }
#sheet { background:var(--panel); border-radius:22px; max-width:560px;
  margin:0 auto; padding:18px; animation:pop .22s ease-out; }
@keyframes pop { from { transform:scale(.94) translateY(8px); opacity:0; } }
.dhero { display:flex; justify-content:center; margin:0 0 12px; }
.dhero .th { border-radius:20px; }
#sheet h2 { font-size:16px; margin:6px 0; }
#sheet h3 { font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
  color:var(--lo); margin:18px 0 4px; padding-left:22px; position:relative; }
#sheet h3::before { content:""; position:absolute; left:0; top:50%; width:14px;
  height:2px; background:var(--mint); border-radius:1px; }
.dprice { display:flex; align-items:baseline; gap:10px; margin:8px 0; flex-wrap:wrap; }
.dprice b { font-size:26px; color:var(--mint); font-weight:900; }
.dprice b.hot { color:var(--coral); }
.dprice span, .dprice s { color:var(--lo); }
/* Подсказките при писане. Целта е ДА СЕ ВИЖДА разликата: „орехи ·
   Бакалия“ и „орехите · марка · Месо и риба“ един под друг, с брой
   вериги отдясно — така изборът е информиран, а не налучкване. */
.sug { background:var(--panel); border-radius:14px; padding:4px; margin:8px 0; }
.sugrow { display:flex; align-items:center; gap:9px; padding:8px 9px;
  border-radius:10px; cursor:pointer; min-height:46px; }
.sugrow:hover { background:var(--panelhi); }
.sugt { flex:1; min-width:0; font-weight:600; font-size:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sugrow .mini { flex:none; }
.sugrow b.mini { color:var(--mint); }

.crow { background:var(--panelhi); border-radius:12px; padding:9px 11px; margin:6px 0;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.crow .th { border-radius:9px; }
.crow .th + .tag { margin-left:0; }
.sub .th { border-radius:7px; }
.crow.best { background:rgba(63,221,162,.10); }
.crow .cn { flex-basis:100%; font-size:11px; color:var(--lo);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crow b { margin-left:auto; }
.crow small { color:var(--amber); }
.mini { font-size:10.5px; color:var(--lo); }
canvas { width:100%; display:block; }
.dbtns { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
.btn { display:block; text-align:center; background:rgba(63,221,162,.14);
  color:var(--mint); border:1px solid rgba(63,221,162,.4); border-radius:13px;
  padding:12px; font-weight:700; font-size:14px; text-decoration:none; cursor:pointer; }
.btn.ghost { background:none; border-color:var(--line); color:var(--lo); }
footer { text-align:center; color:var(--lo); font-size:12px; padding:18px 20px 8px; }
footer b { color:var(--mint); }

/* --- Достъпност и палец ---
   Пръстът иска 44 px. Чиповете бяха 34, а ✕ за триене на артикул — 22,
   тоест по-малко от половината от препоръчаното. Шрифтовете под 11 px
   също отпадат: .pill и .mini бяха 10.5. */
.chip { min-height:40px; display:inline-flex; align-items:center; }
.cat { min-height:52px; }
.litem .x { min-width:44px; min-height:44px; right:4px; top:2px;
  display:flex; align-items:center; justify-content:center; font-size:15px; }
.litem > b { right:52px; }
.litem .sub { min-height:34px; display:flex; align-items:center; gap:4px; }
.pill, .mini { font-size:11.5px; }
:focus-visible { outline:2px solid var(--mint); outline-offset:2px; border-radius:8px; }
.crow[role="button"] { cursor:pointer; }
.crow .chev { color:var(--lo); font-weight:800; margin-left:4px; }
#sheet:focus { outline:none; }
.themebtns { display:flex; gap:6px; }
/* Radar 3.12 — quiet surfaces, readable products, one clear action. */
:root{--ink:#141c18;--panel:#202b24;--panelhi:#2b3830;--line:#3d4a40;--hi:#e4ede3;--lo:#aab9ab;--mint:#cee6be;--violet:#aab9ab;--herobg:#141c18;--heroon:#e4ede3;--herosub:#aab9ab;--badgebg:#a64b35;--badgefg:#fff}
@media(prefers-color-scheme:light){html:not([data-theme="dark"]){--ink:#f6f5ef;--panel:#fffef9;--panelhi:#eeeee4;--line:#d9dfd3;--hi:#193e2d;--lo:#626c61;--mint:#214b32;--violet:#626c61;--herobg:#f6f5ef;--heroon:#193e2d;--herosub:#626c61;--mint16:#e4edcf;--mint55:#8a9d70;--mintfg:#fffef9}}
html[data-theme="light"]{--ink:#f6f5ef;--panel:#fffef9;--panelhi:#eeeee4;--line:#d9dfd3;--hi:#193e2d;--lo:#626c61;--mint:#214b32;--violet:#626c61;--herobg:#f6f5ef;--heroon:#193e2d;--herosub:#626c61;--mint16:#e4edcf;--mint55:#8a9d70;--mintfg:#fffef9}
header{position:relative;padding:20px;max-width:680px;margin:auto;background:var(--ink)}
header::after{display:none}h1{font-size:26px;font-weight:600;letter-spacing:-1px}h1 small{font-size:12px;letter-spacing:0}.logo s{animation:none}
main{padding:8px 20px 20px}.home-intro{margin:2px 0 14px}.home-intro>span{font-size:11px;letter-spacing:1.5px;color:var(--lo)}
.home-intro h2{font:500 36px/1.08 Georgia,serif;letter-spacing:-1px;margin:8px 0 14px}
.home-list{width:100%;display:flex;justify-content:space-between;background:var(--mint);color:var(--mintfg);border:0;border-radius:10px;padding:15px;font:500 15px system-ui;cursor:pointer}
.search input{font-size:16px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.daily-note{font-size:12px;color:var(--lo);margin:12px 0}.daily-note summary,.store-filter summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.store-filter summary:after{content:"＋";margin-left:auto}
.store-filter{border-bottom:1px solid var(--line)}.store-filter[open] summary:after{content:"−"}
.chip,.cat{border-radius:8px;font-weight:500}.cat{background:transparent;border-color:transparent;min-height:44px;flex-direction:row;gap:5px}.cat u{display:none}.cat span{font-size:14px}
.card{border:0;border-bottom:1px solid var(--line);border-radius:8px;padding:15px 12px;gap:12px;box-shadow:none;flex-wrap:wrap}
.card>.th{width:60px!important;height:60px!important}.card>.mid{flex-basis:calc(100% - 84px)}.card>.pr{margin-left:auto;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:6px 10px}.card>.pr b{font-size:25px}.card>.pr .badge{margin:0}
.nm{font-size:16px;line-height:1.4}.tag{letter-spacing:0;font-weight:500}.th.ico{background:var(--panelhi);border:0;color:var(--lo)}
.pill{border-radius:5px}.panel,.litem{border-radius:12px;box-shadow:none}.win{border-bottom:3px dotted var(--line);border-radius:10px;padding:16px;background:var(--panelhi)}.winname{font-weight:500}
.big,.btn{border-radius:9px;min-height:44px}.nav{border-radius:0;box-shadow:none;border-top:1px solid var(--line);background:var(--panel)}.nav button{font-weight:500;font-size:14px}
.basket-amount{display:flex;align-items:center;gap:8px;margin:8px 0 8px 28px;font-size:12px}
.basket-amount input{width:80px}.basket-amount input,.basket-amount select{min-height:44px;background:var(--panelhi);color:var(--hi);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:16px}
.dhero{float:right;margin:0 0 10px 12px}.dhero .th{width:68px!important;height:68px!important}.dtop h2{font-size:21px}.dbtns{clear:both;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.dbtns .btn{font-size:13px}.dbtns .btn[data-share],.dbtns .btn[data-close]{background:transparent;color:var(--lo);border:1px solid var(--line)}
#sheet{background:var(--panel)}.note{line-height:1.5}footer{max-width:640px;margin:auto}
@media(min-width:600px){.card{flex-wrap:nowrap}.card>.mid{flex-basis:auto}.home-intro h2{font-size:42px}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i><i></i><i></i><s></s><b></b></div>
  <h1>радар<small>Твоят списък. По-добра сметка.</small></h1>

function abbrevOk(name, alts, w) {
  const t = typeOf(name);
  if (!t) return true;
  const tw = qWords(t);
  if (tw.includes(w)) return true;
  return tw.some(x => alts.some(a =>
    x.startsWith(a) || (a.startsWith(x) && x.length >= 4 && a.length - x.length <= 2)));
}

/* Синоними и транслитерация — огледало на DataFeed. „Омар“ намира
   лобстер, „милка“ намира Milka. */
const SYN_GROUPS = [
  ["омар","лобстер","лобстър"],["скарид","шримс"],["пелен","памперс"],
  ["пуйк","пуешк"],["телешк","говежд"],["чушк","пиперк"],
  ["сьомг","somon","salmon"],["октопод","ахтапод"],["кашкавал","качокавал"],
  ["фъстъчен","фъстъц"],["уиски","whisky","whiskey"],["хамбургер","бургер"]];
const TRANSLIT = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z",
  "и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s",
  "т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a",
  "ь":"y","ю":"yu","я":"ya","ё":"yo"};
const translit = w => [...w].map(c => TRANSLIT[c] ?? c).join("");
function altsFor(q) {
  const out = [q];
  const g = SYN_GROUPS.find(g => g.some(t => t.startsWith(q) || q.startsWith(t)));
  if (g) out.push(...g);
  const tr = translit(q);
  if (tr !== q) out.push(tr);
  return out;
}

function matchScore(product, query) {
  if (["орех", "орехи"].includes(query.trim().toLowerCase())) {
    const words = qWords(product);
    if (words.includes("орехите") && !words.some(w => w === "орех" || w === "орехи")) return -1;
  }
  const pw = qWords(product);
  if (!pw.length) return -1;
  const qw = qWords(query).filter(w => w.length >= 3);
  if (!qw.length) {
    const q = query.trim().toLowerCase();
    return (q.length >= 2 && pw.some(w => w.startsWith(q))) ? 0 : -1;
  }
  const single = qw.length === 1;
  let worst = 0, first = 1e9;
  for (const q of qw) {
    const alts = altsFor(q);
    let found = -1;
    for (let i = 0; i < pw.length; i++) {
      const k = hitKind(pw[i], alts);
      if (!k) continue;
      if (k === 1 && !abbrevOk(product, alts, pw[i])) continue;
      if (single && i > 0 && MARKERS.has(pw[i-1])) continue;
      if (single && i > 1 && pw[i-1] === "на" && SCENT.has(pw[i-2])) continue;
      if (single && i > 3) continue;
      found = i; break;
    }
    if (found < 0) return -1;
    if (found > worst) worst = found;
    if (found < first) first = found;
  }
  if (!single && first > 0 && MARKERS.has(pw[first-1])) return -1;
  if (!single && first > 1 && pw[first-1] === "на" && SCENT.has(pw[first-2])) return -1;
  return worst;
}
/* „С АРОМАТ НА ПЪПЕШ“ — след тези „на X“ описва миризма, не стоката. */
const SCENT = new Set(["аромат","вкус","мирис"]);

const SRC_LABEL = { 1: "официална", 2: "от магазина" };

const isFar = chain => S.nearOnly && S.geoKm
  && S.geoKm[chain] != null && S.geoKm[chain] > NEAR_RADIUS;

/* ---------- какво точно е съвпаднало ----------
   „Орехи“ намираше „ШПЕК КЛАСИК ОРЕХИТЕ“, защото „Орехите“ е МАРКА
   колбаси. „Мед“ намираше „Медикс“. „Лук“ намираше „Лукчета Бронхо“ и
   „Сапун Лукс“. „Кафе“ намираше кафеавтомат. Всичките са едно и също:
   думата съвпада, стоката — не.

   Лексикално не се разграничават: „орехите“ Е членувано множествено на
   „орех“. Разграничава ги само СМИСЪЛЪТ, а него го дава AI етикетът.
   Затова всяко попадение получава степен: */
/* Хомоглифи. В етикетите на AI-я се срещат латински букви вътре в
   кирилски думи: типът на „Прясно Мляко Верея“ е „прясно млякo 3%“ с
   ЛАТИНСКО o. Без изравняване „мляко“ не съвпада с „млякo“ и 25 истински
   млека изчезваха от търсенето. Изравняването важи и за двете страни,
   значи транслитерацията („milka“) продължава да работи. */
const CONFUSABLE = { a: "а", c: "с", e: "е", o: "о", p: "р", x: "х", y: "у",
                     k: "к", m: "м", t: "т" };
// Класът се строи от самата таблица. Написан на ръка, той вече веднъж
// изпусна точно „o“ — буквата, заради която започна всичко.
const CONFUSABLE_RE = new RegExp("[" + Object.keys(CONFUSABLE).join("") + "]", "g");
const _foldCache = new Map();
function fold(w) {
  let v = _foldCache.get(w);
  if (v !== undefined) return v;
  v = w.replace(CONFUSABLE_RE, ch => CONFUSABLE[ch]);
  if (_foldCache.size < 60000) _foldCache.set(w, v);
  return v;
}
const NEAR_FORM = (w, q) =>
  // същата дума в друго число или членувана: „домат“ ↔ „домати“
  (w.startsWith(q) && w.length - q.length <= 2) ||
  (q.startsWith(w) && q.length - w.length <= 2 && w.length >= 4);
// същото правило като в hitKind, но за една двойка думи
const SAME_START = (w, q) => w.startsWith(q) || (q.startsWith(w) && w.length >= 4);

/* Думите на етикета се разчитат веднъж на ред и се помнят върху него —
   labKey прави няколко операции над низ, а редовете са 28 000.
   Кешът носи ВЕРСИЯ на етикетите: индексът за търсене и labels.json се
   теглят паралелно, значи първото търсене може да е преди етикетите. Без
   версията то запомняше „няма етикет“ завинаги и филтърът оставаше мъртъв
   до презареждане на страницата. */
let labelsVersion = 0;
function labWords(it) {
  if (it._lv !== labelsVersion) {
    const l = labelFor(it.n);
    it._tw = (l && l.t) ? qWords(l.t).map(fold) : null;
    it._bw = (l && l.b) ? qWords(l.b).map(fold) : null;
    it._lv = labelsVersion;
  }
  return it;
}
/*  3 — заявката е самата стока (дума от типа, в която и да е форма)
    2 — друга дума със същото начало („кафеавтомат“ при „кафе“)
    1 — само марката („Орехите“, „Медикс“)
    0 — само в името: етикетът казва, че стоката е нещо друго
   −1 — няма етикет или няма тип → не гадаем, пуска се */
function tierOf(it, alts) {
  labWords(it);
  if (!it._tw) return -1;
  if (it._tw.some(w => alts.some(a => NEAR_FORM(w, a)))) return 3;
  if (it._tw.some(w => alts.some(a => SAME_START(w, a)))) return 2;
  if (it._bw && it._bw.some(w => alts.some(a => SAME_START(w, a)))) return 1;
  return 0;
}

function searchIn(items, query, limit = 80, near = false) {
  const seen = new Set();
  let rows = items
    .map(it => [it, matchScore(it.n, query)])
    .filter(([it, sc]) => sc >= 0 && !S.hidden.has(it.s) && !(near && isFar(it.s)))
    .sort((a, b) => a[1] - b[1]
      || (a[0].u == null) - (b[0].u == null)
      || (a[0].u ?? a[0].p) - (b[0].u ?? b[0].p))
    .filter(([it]) => {
      const k = it.s + "|" + (it._l || it.n.toLowerCase());
      if (seen.has(k)) return false;
      seen.add(k); return true;
    })
    .map(([it]) => it);

  /* Кое от двете е искал човекът — стока или марка — не се гадае, а се
     чете от самите резултати:

       „орехи“  → 34 съвпадат по ТИП, 18 само по марка → търси стока,
                  значи шпекът „Орехите“ е шум и отпада;
       „милка“  → 27 по тип, 183 само по марка → търси МАРКА, всичко остава.

     Същото и за втория случай: щом мнозинството съвпадат с точната дума
     („домат“ за „домати“), тези с друга дума от същото начало
     („кафеавтомат“ за „кафе“) са шум.

     Редовете без етикет (2% от каталога) никога не отпадат — при липса
     на данни се пуска, не се гадае. */
  const qw = qWords(query).filter(w => w.length >= 3);
  if (S.labels && qw.length && rows.length) {
    const alts = [...new Set(qw.flatMap(altsFor))].map(fold);
    let tiers = rows.map(it => tierOf(it, alts));
    /* Степента ПОДРЕЖДА, не само отсява. „K-Classic Орехи XXL“ (тип
       „орехи“) стои след „ОРЕХИТЕ ШПЕК“ само защото марката е първата
       дума в името. Подредбата по степен слага истинската стока отпред,
       дори когато шумът не може да бъде махнат. */
    const order = rows.map((it, i) => i)
      .sort((a, b) => tiers[b] - tiers[a] || a - b);
    rows = order.map(i => rows[i]);
    tiers = order.map(i => tiers[i]);
    const c = { "-1": 0, 0: 0, 1: 0, 2: 0, 3: 0 };
    for (const t of tiers) c[t]++;
    const inType = c[3] + c[2];
    // Праг от 3: под него данните са твърде тънки, за да се решава.
    const dropWord = c[3] >= 3;
    const dropBrand = inType >= 3 && inType > c[1];
    // За „само в името“ прагът е двоен. Етикетите не са безгрешни —
    // „515Г ЛЮТЕН.ОЛИНЕЗА“ носи тип „лютеница“ и празна марка, тоест
    // единственото място с думата „олинеза“ е името. При тесен превес
    // такъв ред е по-вероятно да е верен, отколкото шум.
    const dropName = c[3] >= 3 && c[3] > c[0] * 2;
    if (dropWord || dropBrand || dropName) rows = rows.filter((_, i) =>
      !(dropWord && tiers[i] === 2) &&
      !(dropBrand && tiers[i] === 1) &&
      !(dropName && tiers[i] === 0));
  }
  return rows.slice(0, limit);
}

/* `keep` се прилага ПРЕДИ да се избере най-евтиното от всяка верига.
   Иначе от „Кауфланд“ оставаше само спиртната напитка (най-евтината) и
   цялата верига отпадаше, вместо да покаже плодовата напитка. */
function pricesEverywhere(items, query, keep) {
  const per = {};
  // Таванът е 2000, не 300: `keep` отсява НАД него, значи нисък таван
  // режеше вериги още преди филтъра. Измерено — при 5% от продуктите се
  // губеха вериги („Бебешко пюре телешки гулаш“: 12 вместо 16).
  for (const h of searchIn(items, query, 2000)) {
    if (keep && !keep(h)) continue;
    const k = h.s.toLowerCase();
    const v = h.u ?? h.p;
    if (!(k in per) || v < (per[k].u ?? per[k].p)) per[k] = h;
  }
  const rows = Object.values(per);
  const withUnit = rows.filter(r => r.u != null).length;
  return withUnit * 2 >= rows.length
    ? rows.sort((a, b) => (a.u == null) - (b.u == null) || (a.u ?? 1e9) - (b.u ?? 1e9) || a.p - b.p)
    : rows.sort((a, b) => a.p - b.p);
}

/* ---------- категории: огледало на Categories.of ---------- */
const ING = new Set(["с","със","от","вкус","аромат","за"]);
function tokenize(name) {
  return name
    .replace(/(?<=[a-zа-яё])(?=[A-ZА-ЯЁ])/g, " ")
    .replace(/(?<=[a-z])(?=[а-яё])|(?<=[а-яё])(?=[a-z])/g, " ")
    .replace(/(?<=[A-Za-zА-Яа-яЁё])(?=\d)|(?<=\d)(?=[A-Za-zА-Яа-яЁё])/g, " ")
    .toLowerCase().split(/[^0-9a-zа-яё]+/).filter(Boolean);
}
const labKey = n => n.replace(/\s+/g, " ").trim().toLowerCase().slice(0, 80);

/* ---------- NameClean: разлепяне на счупени имена ----------
   Огледало на NameClean.kt. Кауфланд строи името от съседни <span>-ове
   без разделител и textContent ги слепва:
     „Омарот нашата витринакг-20% отстъпка с“ = Омар | от нашата витрина |
     кг | -20% отстъпка с
   Скрейпърът вече го прави правилно, но старите записи във фийда остават
   счупени до следващото пълно обхождане — затова се чисти и тук.
   Внимание с хомоглифите: „Raid Eлектрически“ е с ЛАТИНСКО E вътре в
   кирилска дума. Затова правилата искат по ДВА знака от всяка страна на
   границата, иначе накъсват имената на срички. */
const NC_TAIL = [
  /\s*[-–—]?\s*\d{1,2}\s*%?\s*отстъпка(\s+с)?\s*$/i,
  /\s*цена\s+с(\s+карта)?\s*$/i,
  /\s*[-–—]\s*\d{1,2}\s*%\s*$/,
  /\s*само\s+с\s+карта\s*$/i,
];
/* „Омар ОТ НАШАТА ВИТРИНА кг“ описва къде стои омарът, не какъв е — тези
   фрази трябва да изчезнат, иначе сравнението хваща „нашата“ и вади хляб
   до омара. Маха се цялата фраза С предлога: „Нашата Трапеза“ е марка. */
const NC_MARKETING = [
  /\s*от\s+(нашата|нашето|свежата|нашия|нашите)\s+\S+/ig,
  /\s*от\s+витрината/ig,
  /\s*от\s+(нашата\s+)?(пекарна|скара|кухня|месарница)/ig,
  /\s*(само\s+)?в\s+магазините?\s+на\s+\S+/ig,
];
const NC_GLUED_PREP =
  /([А-Яа-яЁё]{3,})от\s+(нашата|нашето|свежата|нашия|нашите|витрината)/ig;
/* Гола единица най-накрая, без число пред нея: „Омар кг“ → „Омар“.
   „Мляко 1 л“ остава — там числото носи смисъл. */
const NC_TRAILING_UNIT = /(?<![\d,.])\s+(кг|гр\.|гр|г|мл|л|бр\.|бр)\s*$/i;
const NC_CASE = /([a-zа-яё])([A-ZА-ЯЁ][a-zа-яё])/g;
const NC_LAT_CYR = /([A-Za-z]{2})([А-Яа-яЁё]{2})/g;
const NC_CYR_LAT = /([А-Яа-яЁё]{2})([A-Za-z]{2})/g;
const NC_ALPHA_NUM = /([A-Za-zА-Яа-яЁё]{2})(\d)/g;
const NC_NUM_ALPHA = /(\d)([A-Za-zА-Яа-яЁё]{2})/g;
/* Думи, които веригите слагат в отделен <span> след името. Търсят се само
   в края на дума и само ако отпред остава нещо смислено — за да не
   разцепим „млекар“ на „мле“+„кар“. */
const NC_GLUED_SUFFIX = [
  "от нашата витрина", "от свежата витрина", "от витрината",
  "от нашата пекарна", "от нашето месарство",
  "отстъпка с", "отстъпка", "цена с карта", "цена с",
  "кг", "гр", "мл", "бр", "литра", "литър", "опаковка", "пакет",
  "различни видове", "различни сортове", "различни",
];
const NC_LETTER = /[A-Za-zА-Яа-яЁё]/;
function ncSplitWord(w) {
  if (w.length < 5) return w;
  const lower = w.toLowerCase();
  for (const suf of NC_GLUED_SUFFIX) {
    const s = suf.replace(/ /g, "");
    if (lower.length > s.length + 3 && lower.endsWith(s)) {
      const head = w.slice(0, w.length - s.length);
      if (head.length >= 4 && NC_LETTER.test(head)) return head + " " + suf;
    }
  }
  return w;
}
function ncClean(raw) {
  let s = raw.replace(/\s+/g, " ").trim();
  s = s.replace(/\d+[.,]\d{2}\s*(?:€|EUR|лв\.?)/gi, " ").trim();
  // 1. опашки — до три пъти, защото се трупат
  for (let i = 0; i < 3; i++) {
    const before = s;
    for (const re of NC_TAIL) s = s.replace(re, "").trim();
    if (s === before) break;
  }
  // 2. смяна на азбука / буква↔цифра, преди речника: така „витринакг-20%“
  //    вече е загубило опашката си. В цикъл, защото едно минаване не хваща
  //    верига от три слепени части.
  for (let i = 0; i < 3; i++) {
    const before = s;
    s = s.replace(NC_CASE, "$1 $2").replace(NC_LAT_CYR, "$1 $2")
         .replace(NC_CYR_LAT, "$1 $2").replace(NC_ALPHA_NUM, "$1 $2")
         .replace(NC_NUM_ALPHA, "$1 $2");
    if (s === before) break;
  }
  s = s.split(" ").map(ncSplitWord).join(" ");            // 3. речник
  s = s.replace(NC_GLUED_PREP, "$1 от $2");               // 4. слепен предлог
  for (const re of NC_MARKETING) s = s.replace(re, "");
  s = s.replace(NC_TRAILING_UNIT, "");                    // 5. гола единица
  return s.replace(/\s+/g, " ").trim()
          .replace(/^[-–—·,\s]+/, "").replace(/[-–—·,\s]+$/, "");
}
const _ncCache = new Map();
function nameClean(raw) {
  if (!raw || !raw.trim()) return raw;
  const hit = _ncCache.get(raw);
  if (hit !== undefined) return hit;
  let res = ncClean(raw);
  // Предпазител: ако правилата са изяли смисъла, по-добре шумното
  // оригинално име, отколкото празен ред.
  if ((res.match(/[A-Za-zА-Яа-яЁё]/g) || []).length < 3)
    res = raw.replace(/\s+/g, " ").trim();
  if (_ncCache.size < 30000) _ncCache.set(raw, res);
  return res;
}

/* Иконата на един продукт: типът от AI, после категорията. */
const _icoCache = new Map();
function iconOf(name) {
  const hit = _icoCache.get(name);
  if (hit) return hit;
  const cat = catOf(name);
  // Типът от AI, когато го има (98,7%), иначе самото име. И в двата
  // случая се търси едно и също — така имената без етикет не минават по
  // друг, по-глупав път.
  const t = typeOf(name).toLowerCase();
  const words = t ? t.split(" ") : tokenize(name);
  const probe = t || name.toLowerCase();
  let g = null;
  // 1. Двусмислените думи, гледани спрямо ЦЕЛИЯ низ и на която и позиция
  //    да стоят: „краве масло“ е масло, макар водещата дума да е „краве“.
  for (const w of words) {
    const ref = ICON_REFINE[w];
    if (!ref) continue;
    for (const [mark, glyph] of ref) if (probe.includes(mark)) { g = glyph; break; }
    if (g) break;
  }
  // 2. Иначе първата дума, за която изобщо има форма.
  if (!g) for (const w of words) if (ICON_FOR[w]) { g = ICON_FOR[w]; break; }
  // Алкохолът винаги е бутилка, каквото и да е казал типът. Полето `a` от
  // AI-я е по-надеждно от думите и вече го ползваме на други места.
  if ((g === "juice" || g === "water" || !g) && isAlcohol(name)) g = "bottle";
  const res = { g: GLYPH[g || CAT_ICON[cat] || "box"], c: CAT_INK[cat] || CAT_INK.drugo };
  if (_icoCache.size < 40000) _icoCache.set(name, res);
  return res;
}
/* Плочката: истинската снимка, ако я има, иначе рисуваната икона. */
function thumb(name, img, px) {
  const url = safeUrl(img);
  if (url) return `<img class="th" loading="lazy" src="${esc(url)}" alt=""
    referrerpolicy="no-referrer" style="width:${px}px;height:${px}px">`;
  const { g, c } = iconOf(name);
  return `<span class="th ico" style="width:${px}px;height:${px}px;--ic:${c}">
    <svg viewBox="0 0 24 24" width="${Math.round(px * 0.54)}" height="${Math.round(px * 0.54)}"
      fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">${g}</svg></span>`;
}

const PACK_WORDS = new Set(["буркан"]);
/* Кешът е задължителен, не разкош: catOf по 2253 оферти отнема 865 ms,
   докато етикетите ги няма, и се вика при ВСЯКО рисуване — всеки чип,
   всяка буква в търсачката. Празни се при идване на етикетите. */
const _catCache = new Map();
function catOf(name) {
  const hit = _catCache.get(name);
  if (hit !== undefined) return hit;
  const res = catOfRaw(name);
  if (_catCache.size < 60000) _catCache.set(name, res);
  return res;
}
function catOfRaw(name) {
  // AI етикетът печели пред правилата — той разбира смисъла
  if (S.labels) {
    const lb = S.labels[labKey(name)];
    if (lb && lb.c) return lb.c;
  }
  const low = name.toLowerCase();
  const words = tokenize(name);
  if (!words.length) return "drugo";
  let bc = "", bi = 1e9, bs = -1, bst = "", nonPack = false;
  const offer = (c, i, s, st = "") => {
    if (!PACK_WORDS.has(st)) nonPack = true;
    if (i < bi || (i === bi && s > bs)) { bc = c; bi = i; bs = s; bst = st; }
  };
  for (const [cat, stems] of RULES) for (const stem of stems) {
    const t = stem.trim();
    if (/[^a-zа-яё ]/.test(t)) { if (low.includes(t)) offer(cat, 1, t.length, t); continue; }
    const exact = stem !== t;
    const parts = t.split(" ");
    let done = false;
    for (let i = 0; i <= words.length - parts.length; i++) {
      let ok = true;
      for (let j = 0; j < parts.length; j++) {
        const w = words[i + j], p = parts[j];
        if (exact ? w !== p : !(w.startsWith(p) && (p.length >= 5 || w.length <= p.length + 3))) { ok = false; break; }
      }
      if (!ok) continue;
      if (i === 0 || !ING.has(words[i-1])) { offer(cat, i, t.replace(/ /g, "").length, t); done = true; }
      break;
    }
    if (!done && !exact && parts.length === 1 && parts[0].length >= 4) {
      for (let i = 0; i < words.length; i++) {
        if (words[i].includes(parts[0]) && !/\d/.test(words[i])) {
          if (i === 0 || !ING.has(words[i-1])) offer(cat, i, parts[0].length - 1, t);
          break;
        }
      }
    }
  }
  if (bs >= 0 && PACK_WORDS.has(bst) && !nonPack) return "teh";
  return bs >= 0 ? bc : "drugo";
}

const sugNorm = t => t.toLowerCase().replace(/\d+[.,]?\d*\s*%?/g, " ")
  .split(/[^0-9a-zа-яё]+/)
  .filter(w => w && !SUG_STOP.has(w) && !/^\d/.test(w)).join(" ").trim();

let SUGGEST = null;
function buildSuggest() {
  if (!S.labels || !S.search || !S.search.length) return;
  const idx = new Map();
  const put = (text, cat, chain, kind) => {
    const t = sugNorm(text);
    if (t.length < 3 || t.split(" ").length > 4) return;
    const k = kind + "|" + t;
    let e = idx.get(k);
    if (!e) idx.set(k, e = { t, cat, kind, ch: new Set(), f: fold(t) });
    e.ch.add(chain);
  };
  for (const it of S.search) {
    const l = labelFor(it.n);
    if (!l) continue;
    if (l.t) put(l.t, l.c, it.s, "s");
    if (l.b && l.b.length >= 3) put(l.b, l.c, it.s, "b");
  }
  // Праг по ВЕРИГИ, не по редове: една верига с двайсет разфасовки не
  // прави стоката разпространена.
  SUGGEST = [...idx.values()]
    .map(e => ({ t: e.t, cat: e.cat, kind: e.kind, f: e.f, n: e.ch.size }))
    .filter(e => e.n >= (e.kind === "s" ? 2 : 3));
}

function suggestFor(query, max = 6) {
  if (!SUGGEST) buildSuggest();
  if (!SUGGEST) return [];
  const q = fold(query.toLowerCase().trim());
  if (q.length < 2) return [];
  const hits = [];
  for (const e of SUGGEST) {
    if (!e.f.split(" ").some(w => w.startsWith(q))) continue;
    // Покритието води; фраза, която ЗАПОЧВА със заявката, получава бонус —
    // „ориз“ пред „пюре броколи ориз“.
    hits.push([e, e.n + (e.f.startsWith(q) ? 15 : 0)]);
  }
  hits.sort((a, b) => b[1] - a[1] || a[0].t.length - b[0].t.length);
  // Най-много две от категория. Целта е да се видят РАЗЛИЧНИ неща, а не
  // шест разновидности на едно и също — точно това прави разликата между
  // „орехи“ и „Орехите“ видима.
  const per = {}, out = [];
  for (const [e] of hits) {
    const k = e.kind + e.cat;
    if ((per[k] || 0) >= 2) continue;
    per[k] = (per[k] || 0) + 1;
    out.push(e);
    if (out.length >= max) break;
  }
  return out;
}

/* ---------- цвят на веригата: огледало на StoreColor ---------- */
const FALLBACK = ["#6EC1E4","#E4A76E","#9DE46E","#E46EC1","#6E7BE4","#E4D96E","#6EE4C1","#C16EE4"];
function storeColor(store) {
  const key = store.toLowerCase().split(" (")[0].trim();
  if (STORE_COLORS[key]) return STORE_COLORS[key];
  for (const k in STORE_COLORS) if (key.startsWith(k)) return STORE_COLORS[k];
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.codePointAt(0)) | 0;
  return FALLBACK[(h & 0x7fffffff) % FALLBACK.length];
}

/* Четенето на запазеното НЕ бива да гърми.
   Един повреден запис в localStorage („{broken“, „5“, обект вместо
   списък) хвърляше при създаването на S — тоест на модулно ниво, преди
   да е закачен който и да е обработчик. Резултатът е завинаги празна
   страница без съобщение и без начин за възстановяване освен изтриване
   на данните на сайта. Същото става, когато самото localStorage хвърля:
   Safari в частен режим и забранените бисквитки правят точно това. */
const readArr = (k) => {
  try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
};
const write = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const readStr = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };

const S = {
  idx: null, all: [], search: null, history: null,
  store: null, cat: null, byUnit: false, more: false,
  tab: "today", query: "", limit: 120,
  list: readArr("pr_list"),
  amounts: new Map(readArr("pr_amounts").filter(x => Array.isArray(x) && x.length === 2)),
  checked: new Set(readArr("pr_checked")),
  watch: readArr("pr_watch"),
  seen: new Set(readArr("pr_seen")),
  ranking: null, perItem: null, chosen: null, busy: false,
  cfg: null, reported: {}, repOpen: false,
  labels: null, labelAliases: 0,
  detailStack: [], lastRef: null, histPushed: false,
  hidden: new Set(readArr("pr_hidden")),
  theme: readStr("pr_theme", "auto"),
};
const saveHidden = () => write("pr_hidden", JSON.stringify([...S.hidden]));
/* Ръчна тема. Без нея важи само prefers-color-scheme, а хората често
   искат тъмно приложение върху светла система.
   При „като системата“ атрибутът се МАХА, не се задава празен: празен
   атрибут пак съществува в DOM-а и `closest("[data-theme]")` от бутоните
   намираше <html> при всяко щракване където и да е по страницата. */
function applyTheme() {
  const d = document.documentElement;
  if (S.theme === "auto") d.removeAttribute("data-theme");
  else d.setAttribute("data-theme", S.theme);
}
const saveWatch = () => {
  write("pr_watch", JSON.stringify(S.watch));
  write("pr_seen", JSON.stringify([...S.seen].slice(-400)));
};
/* Ключовата дума на продукт - същата сметка като в приложението. */
const kwOfName = n => n.split(/[\s,()]+/)

const saveList = () => {

  write("pr_amounts", JSON.stringify([...S.amounts]));
  write("pr_checked", JSON.stringify([...S.checked]));

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const discountPct = o => {
  if (o.pct >= 1 && o.pct <= 95) return o.pct;
  if (o.old && o.old > o.price && o.price > 0) return Math.round((1 - o.price / o.old) * 100);
  return null;
};
/* Мерната единица идва от HTML-а на веригите през скрейпъра — значи е
   външен текст и се екранира като всеки друг. */
const unitLbl = l => esc(String(l).replace("лв", "€"));
const unitText = o => (o.unitPrice != null && o.unitLabel)
  ? eur(o.unitPrice) + " " + unitLbl(o.unitLabel) : "";
const unitHit = h => (h.u != null && h.l) ? eur(h.u) + " " + unitLbl(h.l) : "";
/* Линкът също идва от фийда. `esc` пази от чупене на атрибута, но не и от
   javascript: — затова схемата се проверява изрично. */
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u)) ? u : "";

/* ---------- зареждане ----------
   Редът тук има значение, измерен е. Досега офертите се теглеха ЕДНА ПО
   ЕДНА с рисуване след всяка, а етикетите — накрая. Резултат: 4-5
   рисувания по ~865 ms, защото без етикети catOf минава през всички
   правила. Щом дойдат етикетите — 5 ms. Тоест редът беше точно обратният
   на правилния. Сега етикетите тръгват ПЪРВИ и всичко върви паралелно. */
async function boot() {
  // офлайн: черупката и последните данни остават достъпни без обхват
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    // Работникът съобщава, когато е активирал нова версия. Без това човек
    // гледа стар код и не разбира защо поправката я няма.
    navigator.serviceWorker.addEventListener("message", ev => {
      if (ev.data && ev.data.pr === "updated") S.swUpdated = true;
    });
  }
  applyTheme();
  // app-config.json е конфигурацията на ПРИЛОЖЕНИЕТО. Досега тук стоеше
  // config.json — конфигурацията на СКРЕЙПЪРА, която изобщо няма ключ
  // reportUrl, значи бутонът „Цената не е вярна“ не можеше да се появи.
  // Сега файлът е правилният, но `reportUrl` в него още е празен — тоест
  // докладването остава изключено, същото както в приложението, докато
  // не се сложи адрес на Google Form.
  feed("app-config.json").then(c => { S.cfg = c; });

  const pLabels = feed("feed/labels.json").then(applyLabels);
  // Историята НЕ се тегли при старт. Тя вече покрива всичките 79 вериги,
  // не само четирите промоционални, значи е ~500 KB — а трябва само
  // когато човек отвори конкретен продукт.
  feed("feed/digest.json").then(f => {
    S.digest = f ? f.text : null;
    if (S.digest && !S.query) render();
  });

  S.idx = await feed("feed/index.json");
  render();
  if (!S.idx) return;
  const pSearch = loadSearch().then(x => { S.search = x || []; });

  // Всички магазини наведнъж, не един по един.
  const files = await Promise.all(
    S.idx.stores.map(st => feed("feed/offers-" + st.slug + ".json")));
  const acc = [];
  for (const f of files)
    if (f && f.updated === S.idx.updated && f.offers) for (const o of f.offers)
      if (!isJunk(o)) {
        o.rawName = o.name;
        o.requiresCard = o.requiresCard ?? /card|xtra|plus|купон|с карта|\d\s*\+\s*\d/i.test(o.name);
        o.name = nameClean(o.name); acc.push(o);
      }
  S.all = acc;
  await pLabels;            // категориите са верни още при първото рисуване
  render();
  await pSearch;
  if (!S.query) render();
}
/* Мостът към етикетите. Те са записани по СУРОВОТО име от тръбопровода
   („омарот нашата витринакг-20% отстъпка с“), а тук имената вече са
   почистени. Без втори ключ по почистеното име покритието пада наполовина
   — точно това чупеше сравнението и в приложението. */
function applyLabels(f) {
  if (!f || !f.l) { S.labels = null; return; }
  const m = f.l;
  let aliases = 0;
  for (const k of Object.keys(f.l)) {          // снимка: пишем в същия обект
    const ck = labKey(nameClean(k));
    if (ck && ck !== k && !(ck in m)) { m[ck] = f.l[k]; aliases++; }
  }
  S.labels = m;
  S.labelAliases = aliases;
  _catCache.clear();        // етикетът бие правилата — старите отговори падат
  labelsVersion++;          // и думите на етикета по редовете се разчитат наново
}
/* Индексът за търсене се зарежда на ТРИ места (стартиране, кошницата,
   подсказките). Досега това бяха три различни реда код и едното от тях
   пропускаше и филтъра, и почистването — тоест докато то беше активно,
   подсказките показваха слепени имена и добавяха „Омарот“ в списъка. */
async function loadSearch() {
  const f = await feed("feed/search.json");
  if (f && S.idx && f.updated !== S.idx.updated) return null;
  return f ? f.items.filter(it => it.n && !uncertainCurrency(it.s, it.n, it.p, it.o, null, it.currency)).map(cleanRow) : null;
}
function cleanRow(it) {
  it.requiresCard = it.requiresCard ?? /card|xtra|plus|купон|с карта|\d\s*\+\s*\d/i.test(it.n);
  const c = nameClean(it.n);
  if (c !== it.n) { it.r = it.n; it.n = c; }
  // Малките букви веднъж на ред, не милиони пъти в сравнението: df,
  // docFreq и includes минават през целия индекс за всеки кандидат.
  it._l = it.n.toLowerCase();
  return it;
}
const JUNK = /^\s*(тествай|печеливш|тест на продукт|играй|спечели|томбола|виж повече|научи повече|седмични предложени|нови продукти|всички продукти|разгледай|каталог|брошура|абонирай|информация за продукт|налично за доставка|не е налично|кошница с грижа|\d+([.,]\d+)?\s*(пране|бр|броя|г|гр|кг|мл|л|ml|g|kg|l)\b)/i;
function currencyMismatch(name, price) {
  const values = [...name.matchAll(/(\d+[.,]\d{2})\s*(?:€|EUR)/gi)].map(m => Number(m[1].replace(",", ".")));
  return values.some(v => Math.abs(v-price) < 0.02) && !values.some(v => Math.abs(v-price/1.95583) < 0.02);
}
function uncertainCurrency(store, name, price, old, pct, currency) {
  if (currencyMismatch(name, price)) return true;
  const discount = pct ?? (old > price ? Math.round((1 - price / old) * 100) : null);
  return !currency && ["кауфланд", "kaufland"].includes((store || "").toLowerCase()) &&
    discount != null && discount >= 46 && discount <= 52;
}
const isJunk = o => uncertainCurrency(o.store, o.rawName || o.name || "", o.price, o.old, o.pct, o.currency) || !o.name || o.name.trim().length < 3 || JUNK.test(o.name)
  || o.name.includes("/опаковка") || !(o.price > 0) || o.price > 5000
  || !/[A-Za-zА-Яа-я]{3}/.test(o.name);

function viewToday() {
  if (!S.idx) return `<div class="note">Зареждам фийда… Ако това не изчезне, провери връзката.</div>`;
  const q = S.query.trim();
  const upd8 = S.swUpdated
    ? `<div class="panel" style="border:1px solid var(--mint55)">🆕 Има нова версия на сайта.
       <button class="chip" data-reload style="margin-left:8px">Презареди</button></div>` : "";

  let head = `${q.length < 2 ? '<div class="home-intro"><span>ПАЗАРУВАЙ С ЯСНА СМЕТКА</span><h2>Добрите покупки<br>започват оттук.</h2><button class="home-list" data-tab="list">' + (S.list.length ? "Твоята кошница · " + S.list.length + " продукта" : "Създай твоята кошница") + ' <span aria-hidden="true">↗</span></button></div>' : ""}<div class="search"><input id="q" type="search" aria-label="Търси във всички магазини" placeholder="Търси във всички магазини…" value="${esc(S.query)}"></div>`;

  if (q.length >= 2) {
    if (!S.search) return head + `<div class="note">Зареждам индекса за търсене…</div>`;
    // Подсказките стоят НАД резултатите, а не вместо тях: пишеш и виждаш
    // едновременно какво намира сега и какво друго може да имаш предвид.
    const sug = S.sugOff === q ? [] : suggestFor(q);
    const sugHtml = sug.length ? `<div class="sug">` + sug.map(e => `
      <div class="sugrow" role="button" tabindex="0" data-sug="${esc(e.t)}">
        ${thumb(e.t, null, 30)}
        <span class="sugt">${esc(e.t)}</span>
        <span class="mini">${e.kind === "b" ? "марка · " : ""}${esc(catMeta(e.cat)[2])}</span>
        <b class="mini">${e.n} вериги</b></div>`).join("") + `</div>` : "";

    const res = searchIn(S.search, q, 80, true);
    return head + sugHtml + (res.length
      ? `<div class="note">${res.length} резултата · подредени по цена за единица</div>` + res.map(hitRow).join("")
      : `<div class="empty"><b>Нищо за „${esc(q)}“</b><p>Пробвай по-обща дума — „мляко“ вместо „прясно мляко Верея 3%“.</p></div>`);
  }

  // „Наблизо“: разстояние до най-близкия магазин на всяка верига;
  // веригите извън радиуса изчезват от лентата. Без данни в OSM = остава.
  const far = c => S.hidden.has(c)
    || (S.nearOnly && S.geoKm && S.geoKm[c] != null && S.geoKm[c] > NEAR_RADIUS);
  const kmTag = c => (S.geoKm && S.geoKm[c] != null && S.geoKm[c] <= NEAR_RADIUS)
    ? " · " + fmtKm(S.geoKm[c]) : "";

  const digestHtml = (S.digest && !S.digestGone)
    ? `<details class="daily-note"><summary>Бележка за деня · автоматично резюме</summary><p>${esc(S.digest)}</p></details>`
    : "";

  const stores = S.idx.stores.map(s => s.name).filter(c => !far(c));
  const extra = (S.idx.chains || []).filter(c => !stores.includes(c) && !far(c));
  const known = ["Билла","Метро","Фантастико","T-Market","Lilly","BulMag","КООП","ТРИСТА","Жанет","Аванти","Лекси","Класико"];
  extra.sort((a, b) => {
    if (S.geoKm) {
      const ka = S.geoKm[a] ?? 9999, kb = S.geoKm[b] ?? 9999;
      if (ka !== kb) return ka - kb;
    }
    const ia = known.indexOf(a), ib = known.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "bg");
  });

  const officialOnly = S.store && !stores.includes(S.store);

  let chips = `<details class="store-filter"><summary>${S.store ? esc(S.store) : "Всички избрани магазини"} · филтри</summary><div class="chips">` +
    chip("Всички", !S.store, "st:") +
    S.idx.stores.filter(s => !far(s.name)).map(s => chip(esc(s.name + kmTag(s.name)) + ` <u>${s.count}</u>`, S.store === s.name, "st:" + s.name, storeColor(s.name))).join("") +
    chip("за единица", S.byUnit, "unit:", "#F7C266") +
    chip(S.nearOnly ? "📍 наблизо ✓" : "📍 наблизо", S.nearOnly, "near:", "#3FDDA2") +
    (extra.length ? (
      (S.more ? extra : extra.filter(c => c === S.store))
        .map(c => chip(esc(c + kmTag(c)), S.store === c, "st:" + c, storeColor(c))).join("") +
      chip(S.more ? "скрий ▴" : "още вериги ▾", false, "more:", "#A695F2")
    ) : "") + `</div></details>`;

  let rows, names;
  if (officialOnly) {
    if (!S.search) return head + chips + `<div class="note">Зареждам цените…</div>`;
    rows = S.search.filter(it => it.s === S.store);
    names = rows.map(r => r.n);
  } else {
    rows = S.all.filter(o => (!S.store || o.store === S.store) && !S.hidden.has(o.store));
    names = rows.map(r => r.name);
  }

  // --- Следените думи: попаденията чакат при всяко отваряне.
  // Уеб версията няма известия (iOS иска пуш сървър, а ние нямаме сървър
  // по замисъл) - затова радарът докладва тук, на видно място.
  let watchHtml = "";
  if (S.watch.length && S.search) {
    const rows = [];
    for (const kw of S.watch) {
      const hit = searchIn(S.search, kw, 40, true)
        .filter(h => (h.f == null || h.f === 0) && h.o && h.o > h.p)[0];
      const key = hit ? hit.s + "|" + hit.n + "|" + hit.p : "";
      const fresh = hit && !S.seen.has(key);
      if (fresh) { S.seen.add(key); saveWatch(); }
      rows.push(`<div class="rrow" style="display:flex;gap:8px;align-items:center">
        <div style="flex:1;min-width:0">
          <b>${esc(kw)}</b> ${hit
            ? `${fresh ? '<span class="pill mintf">ново</span> ' : ""}- ${esc(hit.n.slice(0, 36))} · <b style="color:var(--coral)">${eur(hit.p)} €</b> в ${esc(hit.s)}`
            : "- няма намаление в момента"}</div>
        <button class="chip" data-unwatch="${esc(kw)}" aria-label="Спри да следиш ${esc(kw)}">🔕</button></div>`);
    }
    watchHtml = `<div class="panel"><b>🔔 Следени думи</b>${rows.join("")}</div>`;
  }

  const present = {};
  for (const n of names) { const c = catOf(n); present[c] = (present[c] || 0) + 1; }
  const catsBar = `<div class="chips cats">` + CATS
    .filter(c => present[c[0]])
    .sort((a, b) => present[b[0]] - present[a[0]])
    .map(c => `<button class="cat ${S.cat === c[0] ? "on" : ""}" data-act="cat:${c[0]}">
      <span>${c[1]}</span>${esc(c[2])}<u>${present[c[0]]}</u></button>`).join("") + `</div>`;

  if (officialOnly) {
    let list = rows.filter(r => !S.cat || catOf(r.n) === S.cat);
    list = S.byUnit ? list.filter(r => r.u != null).sort((a, b) => a.u - b.u)
                    : list.sort((a, b) => a.p - b.p);
    return head + chips + catsBar +
      `<div class="note"><b>${list.length} цени в ${esc(S.store)}</b> — редовни цени от официалните данни на КЗП, не промоции.</div>` +
      list.slice(0, S.limit).map(hitRow).join("") + moreBtn(list.length);
  }

  let list = rows.filter(o => !S.cat || catOf(o.name) === S.cat);
  list = S.byUnit ? list.filter(o => o.unitPrice != null).sort((a, b) => a.unitPrice - b.unitPrice)
                  : list.sort((a, b) => (discountPct(b) || 0) - (discountPct(a) || 0));
  const upd = S.idx.updated ? `<div class="note">${list.length} намаления · данните са от ${esc(S.idx.updated)}</div>` : "";
  return head + upd8 + chips + watchHtml + catsBar + upd +
    (list.length ? list.slice(0, S.limit).map(offerCard).join("") + moreBtn(list.length)
      : `<div class="empty"><b>Още зареждам офертите…</b></div>`);
}

const NEAR_RADIUS = 20; // км
const fmtKm = km => km < 1 ? "под 1 км" : km < 10 ? km.toFixed(1) + " км" : Math.round(km) + " км";
function haversineKm(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(a));
}
async function toggleNear() {
  if (S.nearOnly) { S.nearOnly = false; render(); return; }
  if (!navigator.geolocation) { console.warn("няма геолокация"); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const g = S.geoFeed || (S.geoFeed = await feed("feed/stores-geo.json"));
      const { latitude: la, longitude: lo } = pos.coords;
      const km = {};
      for (const [chain, pts] of Object.entries(g.chains || {})) {
        let best = Infinity;
        for (const p of pts) best = Math.min(best, haversineKm(la, lo, p[0], p[1]));
        if (best < Infinity) km[chain] = best;
      }
      S.geoKm = km; S.nearOnly = true;
    } catch (e) {
      S.geoKm = null;
    }
    render();
  }, () => render(), { maximumAge: 600000, timeout: 8000 });
}

/* Сметката на кошницата.
   Четири неща тук я правят честна и всяко е научено от грешка:
     1. ЦЕНА ЗА ЕДИНИЦА при избора във всяка верига — иначе бутилка 200 мл
        за 0,79 „бие“ литър за 1,99 и кошниците не са съпоставими;
     2. филтър по тип с МНОЗИНСТВО — не по първия резултат, той е просто
        най-евтиният и може да е случаен (за „мляко“ излизаше сирене и
        после отсяваше самото мляко);
     3. подредба по ПОКРИТИЕ, после по сума — верига с 3 от 8 артикула не
        печели с ниска сума;
     4. липсващото се брои и се показва, вместо да минава за 0,00 лв. */
let rankVersion = 0;
function basketDefault(query) {
  const q = query.toLowerCase();
  if (q.includes("яйц")) return { quantity: 10, unit: "бр" };
  if (["прясно мляко", "олио", "вода", "сок"].some(w => q.includes(w))) return { quantity: 1, unit: "л" };
  if (q.includes("кафе")) return { quantity: 0.5, unit: "кг" };
  return { quantity: 1, unit: "кг" };
}
function basketAmount(item) {
  const a = S.amounts.get(item);
  return a && Number.isFinite(a.quantity) && a.quantity > 0 && a.quantity <= 1000 &&
    ["кг","л","бр"].includes(a.unit) ? a : basketDefault(item);
}
function basketQuote(h, amount) {
  if (!Number.isFinite(amount.quantity) || amount.quantity <= 0 || amount.quantity > 1000 ||
      !Number.isFinite(h.p) || h.p <= 0 || (h.currency && h.currency !== "BGN")) return null;
  if (h.requiresCard === true || /card|xtra|plus|купон|с карта|\d\s*\+\s*\d/i.test(h.n)) return null;
  const today = new Date().toLocaleDateString("sv-SE");
  if ((h.validTo && h.validTo < today) || (h.validFrom && h.validFrom > today)) return null;
  const unit = (h.qtyUnit || (h.l || "").split("/")[1] || "").trim();
  if (unit !== amount.unit) return null;
  const pack = h.qty ?? (Number.isFinite(h.u) && h.u > 0 ? h.p / h.u : null);
  if (!Number.isFinite(pack) || pack <= 0) return null;
  const raw = amount.quantity / pack, nearest = Math.round(raw);
  const packs = h.qty == null && nearest >= 1 && Math.abs(raw - nearest) <= 0.005
    ? nearest : Math.ceil(raw - 1e-9);
  if (packs < 1 || packs > 10000) return null;
  return { ...h, packs, total: Math.round(h.p / 1.95583 * 100) * packs / 100 * 1.95583 };
}
async function rank() {
  const version = ++rankVersion;
  S.busy = true;
  try { await rankInner(version); } finally { if (version === rankVersion) S.busy = false; }
  if (version === rankVersion) render();
}
function comparableRows(item) {
  const amount = basketAmount(item);
  let rows = searchIn(S.search, item, 400, true).map(h => basketQuote(h, amount)).filter(Boolean);
  for (let pass = 0; pass < 3; pass++) {
    const values = rows.map(h => h.u).filter(u => u != null).sort((a,b) => a-b);
    if (values.length >= 6) {
      const median = values[Math.floor(values.length / 2)];
      rows = rows.filter(h => h.u == null || (h.u >= median / 3 && h.u <= median * 3));
    }
    const bystore = new Map();
    for (const h of rows) {
      const previous = bystore.get(h.s);
      if (!previous || h.total < previous.total) bystore.set(h.s, h);
    }
    rows = [...bystore.values()];
  }
  return { rows: rows.sort((a,b) => a.total - b.total), unit: true, label: amount.unit };
}

async function rankInner(version) {
  if (!S.search) S.search = (await loadSearch()) || [];
  if (version !== rankVersion) return;
  const per = {}, mode = {}, totals = new Map();
  for (const item of S.list) {
    const result = comparableRows(item);
    per[item] = result.rows; mode[item] = { unit: true, label: result.label };
    for (const h of result.rows) {
      const total = totals.get(h.s) || [0, 0, 0];
      total[0] += h.total; total[1]++; total[2] += h.total;
      totals.set(h.s, total);
    }
  }
  S.perItem = per; S.mode = mode;
  S.ranking = [...totals].map(([c, [s,n,p]]) => [c,s,n,p])
    .sort((a,b) => b[2] - a[2] || a[1] - b[1]);
  if (!S.ranking.some(r => r[0] === S.chosen)) S.chosen = S.ranking[0]?.[0] || null;
}
/* Сметката се преизчислява САМА при промяна на списъка. Досега оставаше
   от предишното смятане: добавен артикул влизаше като 0,00 лв, а
   знаменателят „X от Y“ растеше — числата лъжеха, докато човек не натисне
   бутона пак.
   Рисува се ВЕДНАГА, преди смятането: при бавна връзка rank() чака 3,6 MB
   и добавеният артикул не се появяваше на екрана със секунди. */
function listChanged() {
  rankVersion++; S.ranking = null; S.perItem = null; S.chosen = null;
  saveList();
  render();
  if (S.list.length) rank();
}

/* ---------- детайл ---------- */
/* С коя дума да се сравнява между вериги. Първите две думи често са
   МАРКАТА („ЧУДНИ ВАФЛИ“, „K-Classic“) и не съществуват другаде, затова
   се опитват все по-прости кандидати — кирилските думи преди латинските
   (латинските обикновено са марки), плюс отрязани окончания („вафл“
   хваща и вафла, и вафли) — и печели този с най-много вериги. */
function compareQueryRaw(name, strict) {
  // Кандидатите, от най-точния към най-общия:
  //   1) първите две смислени кирилски думи („извара маджаров“ намира
  //      същия продукт в другите вериги);
  //   2) водещата дума — тази, чиято СОБСТВЕНА категория съвпада с
  //      категорията на продукта („извара“ при mlek);
  //   3) останалите думи и отрязаните им окончания.
  // Определенията („български“, „продукт“, „натурален“) не са стоки и
  // се прескачат, а имената се разлепят („продуктИзвара“ → две думи).
  // В строгия режим („по-точни съвпадения“) остават само комбинациите стока +
  // марка — по-добре честно „няма я другаде“, отколкото друга марка.
  const cat = catOf(name);
  // Плод и месо се продават на тегло — ред в милилитри („БОЧКО ПЗ ПЪПЕШ
  // 75мл“) е козметика или сос, не стоката, каквото и да пише в името.
  const weightCat = cat === "plod" || cat === "meso";
  const VOLQ = /\d+\s*(мл|ml)($|[^а-яa-z])/i;
  const unitGuard = ev => !weightCat ? ev
    : ev.filter(r => !(r.l && r.l.includes("/л")) && !VOLQ.test(r.n));
  const toks = tokenize(name).filter(w => w.length >= 3 && !/^\d/.test(w));
  const cyr = toks.filter(w => /[а-я]/.test(w) && !cmpStop(w));
  const lat = toks.filter(w => !/[а-я]/.test(w) && !cmpStop(w));
  const head = cat !== "drugo" ? toks.find(w => !cmpStop(w) && catOf(w) === cat) : null;
  if (strict) {
    // „По-точно съвпадение“ = стоката + ОТЛИЧИТЕЛНАТА дума (марката). Как се
    // познава марката без списък с марки:
    //   · съставките отпадат — дума след „с/със/от/вкус“ описва пълнежа
    //     („ВАФЛИ С КАКАО“ → какао не е марка);
    //   · много честите думи (150+ реда в индекса: „млечен“, „кисело“)
    //     не са марки — те са описания;
    //   · останалите се опитват от НАЙ-РЯДКАТА нагоре („protein“ преди
    //     „маджаров“) — първата, която намери 2+ вериги, печели;
    //   · редът трябва да съдържа думата БУКВАЛНО — иначе „classico“
    //     хващаше „classic“ на Lindt по общото начало.
    // Име без нито един кандидат за марка („Прясно мляко 3.6%“) е самата
    // стока — тогава важат първите две смислени думи, без ограничение.
    // Има ли кандидат за марка, но никъде другаде — честно 0, не друга
    // марка.
    const raw = tokenize(name);
    const ING = new Set(["с", "със", "от", "вкус", "аромат"]);
    const ingr = new Set();
    raw.forEach((w, i) => { if (i > 0 && ING.has(raw[i - 1])) ingr.add(w); });
    const CAP = 150;
    const df = t => {
      let n = 0;
      for (const it of S.search) if (it._l.includes(t) && ++n > CAP) break;
      return n;
    };
    const head2 = head || cyr[0] || null;   // „Тоалетна хартия Zewa“ няма
    // Най-точният път: каноничният продукт от AI — еднакво p значи
    // по-точни съвпадения, същата разфасовка, до стотинка.
    const myLab = labelFor(name);
    if (myLab && myLab.p) {
      const ev = pricesEverywhere(S.search, myLab.p.split(" ").slice(0, 3).join(" "),
        r => { const lb = labelFor(r.n); return lb && lb.p === myLab.p && kCompatible(name, r.n); });
      if (ev.length >= 2) return [ev, myLab.p];
    }

    // Разпозната марка = единственият партньор („по-точни съвпадения“ = същата
    // марка). Никакво падане към общи думи като „complete“.
    const lbb = myLab && myLab.b ? myLab.b.split(" ")[0] : null;
    const brand = (lbb && lbb.length >= 3 && toks.includes(lbb) ? lbb : null)
      || toks.find(w => BRANDS.has(w));
    if (brand) {
      const bstem = /[а-я]/.test(brand) && brand.length >= 5 ? brand.slice(0, -1) : brand;
      const pool = [];
      if (head2 && head2 !== brand) pool.push(head2 + " " + brand);
      pool.push(brand);
      let sqb = pool[0];
      for (const q of pool) {
        const ev = unitGuard(pricesEverywhere(S.search, q, r =>
          (cat === "drugo" || catOf(r.n) === cat) && kCompatible(name, r.n)
          && r._l.includes(bstem)));
        if (ev.length >= 2) return [ev, q];
        sqb = q;
      }
      return [[], sqb];
    }
    const partners = toks                    // категорийна дума — първата
      .filter(w => w.length >= 4 && !cmpStop(w) && w !== head2 && !ingr.has(w))
      .slice(0, 5)
      .map(w => [w, df(w)])
      .filter(([, d]) => d <= CAP)
      .sort((a, b) => a[1] - b[1]);
    let sq = name.slice(0, 20);
    if (head2) for (const [t] of partners) {
      const isCyr = /[а-я]/.test(t);
      const stem = isCyr && t.length >= 5 ? t.slice(0, -1) : t;
      for (const q of new Set([head2 + " " + t, head2 + " " + stem])) {
        const ev = unitGuard(pricesEverywhere(S.search, q, r =>
          (cat === "drugo" || catOf(r.n) === cat) && kCompatible(name, r.n)
          && r._l.includes(stem)));
        if (ev.length >= 2) return [ev, q];
        sq = q;
      }
    }
    if (!partners.length && cyr.length >= 2) {
      const q = cyr[0] + " " + cyr[1];
      const ev = unitGuard(pricesEverywhere(S.search, q, r =>
        (cat === "drugo" || catOf(r.n) === cat) && kCompatible(name, r.n)));
      if (ev.length >= 2) return [ev, q];
      sq = q;
    }
    return [[], sq];
  }

  // --- широк режим („подобни продукти“) ---
  // Първо типът от AI: това е същинското „подобни“. Полето `t` е точно
  // отговорът на въпроса „какво е това“ и досега не се четеше никъде.
  const aiType = typeOf(name);
  if (aiType.length >= 3 && !tooGeneric(aiType)) {
    const byType = unitGuard(pricesEverywhere(S.search, aiType, r =>
      typeOf(r.n).toLowerCase() === aiType.toLowerCase() && kCompatible(name, r.n)));
    if (byType.length >= 3) return [byType, aiType];
    // Типовете от AI са много подробни („балсам лайка бяло“) — 9 093
    // различни типа за 29 799 етикета. Само ВОДЕЩАТА дума вдига покритието
    // от 10.4% на 37%.
    const headType = aiType.split(" ")[0].trim();
    if (headType.length >= 4 && !tooGeneric(headType)) {
      const byHead = unitGuard(pricesEverywhere(S.search, headType, r =>
        typeOf(r.n).split(" ")[0].toLowerCase() === headType.toLowerCase()
        && kCompatible(name, r.n)));
      if (byHead.length >= 3) return [byHead, headType];
    }
  }

  let cands = [];
  if (cyr.length >= 2) cands.push(cyr[0] + " " + cyr[1]);
  if (head && !tooGeneric(head)) { cands.push(head); if (head.length >= 5) cands.push(head.slice(0, -1)); }
  for (const w of cyr.slice(0, 4)) {
    if (tooGeneric(w)) continue;
    cands.push(w); if (w.length >= 5) cands.push(w.slice(0, -1));
  }
  for (const w of lat.slice(0, 2)) if (!tooGeneric(w)) cands.push(w);
  cands = [...new Set(cands)];
  // Праг по честота: дума, срещана в над 1,5% от каталога, не различава
  // нищо. Точно така „нашата“ печелеше — среща се навсякъде.
  const freqCap = Math.max(12, Math.floor(S.search.length * 15 / 1000));
  const strong = cands.filter(q =>
    q.length >= 4 && (q.includes(" ") || docFreq(q, freqCap) < freqCap));
  if (strong.length) cands = strong;

  const keep = r => (cat === "drugo" || catOf(r.n) === cat) && kCompatible(name, r.n);
  let best = [], bq = cands[0] || name.slice(0, 20);
  for (const q of cands) {
    const ev = unitGuard(pricesEverywhere(S.search, q, keep));
    if (ev.length > best.length) { best = ev; bq = q; }
    if (best.length >= 4) return [best, bq];
  }
  // Строгият вид не намери почти нищо. По-добре по-широк списък, отколкото
  // празен екран — но алкохолът остава изключен, защото точно той беше
  // същинската грешка.
  //
  // Ако строгият вече е дал 3+, мекият изобщо не се пуска: за едно и също
  // `q` мекият винаги връща НАДМНОЖЕСТВО, значи по-малко точен отговор, а
  // и цикълът минава втори път през целия индекс.
  if (best.length >= 3) return [best, bq];
  const soft = r => (cat === "drugo" || catOf(r.n) === cat)
    && isAlcohol(r.n) === isAlcohol(name);
  for (const q of cands) {
    const ev = unitGuard(pricesEverywhere(S.search, q, soft));
    if (ev.length > best.length) { best = ev; bq = q; }
    if (best.length >= 3) return [best, bq];
  }
  return [best, bq];
}
/* Сравнението минава през целия индекс по няколко кандидата — 0,4-2 s на
   продукт. А се вика при всяко отваряне на детайл и при всяко превключване
   между „Подобни“ и „По-точно съвпадение“, тоест по няколко пъти за един и същ
   продукт. Кешът прави второто натискане мигновено. */
const _cmpCache = new Map();
function compareQuery(name, strict) {
  const k = (strict ? "1|" : "0|") + name;
  const hit = _cmpCache.get(k);
  if (hit) return hit;
  const res = compareQueryRaw(name, strict);
  if (_cmpCache.size < 400) _cmpCache.set(k, res);
  return res;
}
const CMP_STOP = CMP_STOP_K; // генерирано от Kotlin
const cmpStop = w => CMP_STOP.some(s => w.startsWith(s));
/* Дума, твърде обща, за да се сравнява по нея. „напитка“, „мляко“, „хляб“
   описват цял рафт, не стока — сравнението по тях е случайна извадка от
   най-евтиното в категорията. */
const TOO_GENERIC = ["напитк","питие","мляко","млечн","хляб","хлебн","месо","месн",
  "риба","рибн","сирен","кашкав","кафе","чай","сок","вода","олио","оцет","ориз",
  "захар","брашно","сол","тесто","консерв","продукт","стока","различн","видов",
  "сорт","асорти","микс","опаковк","пакет","промо","нов","класик"];
/* Служебни думи — никога не могат да са ключ. Причината този списък да
   съществува: счупеното „Омарот нашата витрина кг“ даваше кандидат
   „нашата“, а по него излизаха хляб „от нашата пекарна“ и шпек „Нашата
   Трапеза“ до омар за 30 евро. */
const FUNCTION_WORDS = new Set(["нашата","нашето","нашия","нашият","нашите",
  "наша","наше","наш","витрина","витрината","пекарна","пекарната","скара",
  "кухня","магазин","магазина","магазините","цена","цената","цени","със",
  "без","или","при","над","под","как","този","тази","това","тези","всеки",
  "всяка","всички","само","още","най","супер","мега","екстра","special",
  "нови","нова","ново","оферта","оферти","избор"]);
function tooGeneric(w) {
  const s = w.toLowerCase();
  return FUNCTION_WORDS.has(s) || TOO_GENERIC.some(t => s.startsWith(t));
}
/* В колко имена се среща думата. Спира се на `cap` — точното число няма
   значение, важи само дали думата различава нещо. */
function docFreq(token, cap) {
  const t = token.toLowerCase();
  let n = 0;
  for (const x of S.search) if (x._l.includes(t) && ++n >= cap) return n;
  return n;
}

/* Навигация в детайла. Натискането на ред от „Цените навсякъде“ отваря
   онзи продукт, а „‹ Назад“ (и системният бутон назад) връща. Досега
   редовете бяха просто текст — гледаш по-евтина цена в друга верига и
   няма как да стигнеш до нея. */
function openDetail(ref, push = true) {
  const o = ref.t === "offer"
    ? S.all.find(x => x.store === ref.s && x.name === ref.n)
    : null;

  // Проверката е ПРЕДИ да се пипне навигацията. Иначе при ненамерен
  // продукт листът оставаше показал предишния, S.lastRef сочеше призрак и
  // следващият „Назад“ отваряше пак него — бутонът изглеждаше счупен.

  const ut = o ? unitText(o) : unitHit(base);

  let html = `<div class="dtop">

      ${old ? `<s>${eur(old)} €</s>` : ""}${pct ? `<span class="badge">−${pct}%</span>` : ""}</div>
    ${ut ? `<div class="pill amber">${ut}</div>` : ""}
    <div class="note">${base.requiresCard ? "Условна цена с карта/купон. " : ""}${base.validTo ? "Валидна до " + esc(base.validTo) + "." : "Срокът и наличността не са потвърдени — провери в магазина."}</div>

  if (S.search) {

        ev.slice(0, 7).map((h, i) => {

          return `<div class="crow" ${here ? "" :
            `role="button" tabindex="0" data-open="${esc(JSON.stringify({ t: "hit", s: h.s, n: h.n }))}"`}>
          ${thumb(h.n, null, 34)}
          <span class="tag"><i style="background:${storeColor(h.s)}"></i>${esc(h.s.toUpperCase())}</span>
          
          ${here ? '<span class="mini">← гледаш това</span>' : ""}
          <div class="cn">${esc(h.n)}</div>
          <b>${eur(h.p)} €</b>${unitHit(h) ? `<small>${unitHit(h)}</small>` : ""}

        </div>`; }).join("");

    if (h && h.p.length >= 2) {

        <div class="note">${h.d[0]} → ${h.d[h.d.length - 1]} · всяка точка е засечена промяна</div>`;

  if (S.cfg && S.cfg.reportUrl) {

          style="width:100%;padding:10px;border-radius:10px;background:var(--panelhi);color:var(--hi);border:1px solid var(--line)">
