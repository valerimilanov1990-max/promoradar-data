name: Scrape

on:
  schedule:
    - cron: "0 4 * * *"    # 07:00 БГ — прясната сутрешна брошура
    - cron: "0 11 * * *"   # 14:00 БГ — втора точка за историята на цените
  workflow_dispatch:
    inputs:
      enable_ai:
        description: 'Use paid AI labeling (off for manual validation)'
        type: boolean
        default: false
      publish:
        description: 'Publish only after all quality gates pass'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:                 # две пускания едновременно само си пречат
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Preserve previous coverage baseline
        run: |
          mkdir -p "$RUNNER_TEMP/feed-baseline/feed"
          git fetch --depth=1 origin data
          echo "DATA_BASELINE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git show FETCH_HEAD:feed/index.json > "$RUNNER_TEMP/feed-baseline/feed/index.json"
          git show FETCH_HEAD:feed/history.json > "$RUNNER_TEMP/feed-baseline/feed/history.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          # AI етикетите: ключът живее САМО в GitHub Secrets. Без него
          # стъпката се прескача и правилата поемат всичко.
          ANTHROPIC_API_KEY: ${{ (github.event_name == 'schedule' || inputs.enable_ai) && secrets.ANTHROPIC_API_KEY || '' }}
        run: python scraper.py

      - name: Regression tests and publication gates
        run: |
          python -m unittest test_pipeline.py
          node test-web.js --contract-only
          python validate_feed.py . "$RUNNER_TEMP/feed-baseline"

      - name: Keep validated recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: validated-feed-${{ github.run_id }}
          retention-days: 14
          path: |
            data.json
            feed/

      # ------------------------------------------------------------------
      # Данните отиват в ОТДЕЛЕН клон "data" с история от един-единствен
      # комит. Иначе всекидневният многомегабайтов файл се трупа в git
      # завинаги — за година това са гигабайти, които никой не ползва.
      # Тук всяко пускане презаписва клона наново и хранилището остава малко.
      # ------------------------------------------------------------------
      - name: Publish data branch
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          set -e
          test -f data.json || { echo "няма data.json — скрейпърът се провали"; exit 1; }

          PUB=$(mktemp -d "$RUNNER_TEMP/promoradar-publish.XXXXXX")
          cp data.json "$PUB"/
          cp -r feed "$PUB"/ 2>/dev/null || true

          cd "$PUB"
          git init -q -b data
          git config user.name  "promo-radar-bot"
          git config user.email "bot@promoradar"
          git add -A
          git commit -q -m "data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force-with-lease="refs/heads/data:$DATA_BASELINE_SHA" -q origin data

          echo "Публикувано в клон data:"
          ls -lh data.json feed/ 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "### Промо Радар — резултат" >> $GITHUB_STEP_SUMMARY
          if [ -f data.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("data.json", encoding="utf-8"))
          print(f"- обновено: **{d.get('updated')}**")
          print(f"- оферти: **{len(d.get('offers', []))}**")
          print(f"- официални цени: **{len(d.get('basics', []))}**")
          print(f"- eBag: **{len(d.get('ebag', []))}**")
          st = d.get("stats", {})
          if st:
              print("\n**Статистика**\n")
              for k, v in st.items():
                  print(f"- `{k}`: {v}")
          er = d.get("errors", [])
          if er:
              print(f"\n**Грешки ({len(er)})**\n")
              for e in er[:25]:
                  print(f"- {e}")
          PY
          else
            echo "- скрейпърът не произведе data.json" >> $GITHUB_STEP_SUMMARY
          fi
