name: Scrape
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "40 5 * * *"   # всяка сутрин 04:00 UTC (7:00 БГ)
  workflow_dispatch: {}     # + ръчно пускане от бутона Run workflow
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-bul
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run scraper
        run: python scraper.py
      - name: Commit data
        run: |
          git config user.name "promo-radar-bot"
          git config user.email "bot@promoradar"
          git add data.json
          git diff --cached --quiet || git commit -m "data $(date +%F)"
          git push
